[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "ea_build_backend"
backend-path = ["."]

[project]
name = "engineering-assistant-kernel"
version = "1.0.0.1"
description = "engineering-assistant skill 套件的平台无关运行内核。"
authors = [
  {name = "sunliming625@gmail.com", email = "sunliming625@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0"
]

[project.scripts]
ea = "engineering_assistant.cli:main"
ea-setup = "engineering_assistant.setup_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineering_assistant = ["_assets/**/*"]
