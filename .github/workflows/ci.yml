name: 原生安装与核心验证

on:
  pull_request:
  push:
    branches: [main, teamwork]

permissions:
  contents: read

jobs:
  validate:
    name: 原生验证 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2025
            target: windows-x64
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      PYTHONUTF8: "1"
      ENGINEERING_ASSISTANT_REQUIRE_PROVIDER_SANDBOX: "1"
      EA_SOURCE_COMMIT: ${{ github.sha }}
      EA_CI_REPOSITORY: ${{ github.repository }}
      EA_CI_RUN_ID: ${{ github.run_id }}
      EA_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      EA_CI_TARGET: ${{ matrix.target }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 配置固定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          cache: pip
      - name: 初始化隔离运行目录
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          directories = {
              "ENGINEERING_ASSISTANT_VALIDATOR_CACHE_DIR": root / "ea-official-validators",
              "UV_CACHE_DIR": root / "ea-uv-cache",
              "CLAUDE_CONFIG_DIR": root / "ea-claude-config",
              "EA_CI_ROOT": root / "ea-ci" / os.environ["EA_CI_TARGET"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for name, directory in directories.items():
                  directory.mkdir(parents=True, exist_ok=True)
                  stream.write(name + "=" + str(directory) + "\n")
          PY
      - name: 准备固定开发工具
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.7"
          rustup toolchain install 1.90.0 --profile minimal
          cargo --version
          uv --version
      - name: 使用消费者相同的固定 Windows Python
        if: matrix.target == 'windows-x64'
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          key = "cpython-3.13.13-windows-x86_64-none"
          metadata = Path("config/runtime-python-downloads.json").resolve()
          entry = json.loads(metadata.read_text(encoding="utf-8"))[key]
          root = Path(os.environ["EA_CI_ROOT"]).parent / "windows-python"
          downloads = root / "base"
          virtual = root / "developer-env"
          environment = {key: value for key, value in os.environ.items() if not key.upper().startswith("UV_")}
          environment.update(UV_PYTHON_INSTALL_DIR=str(downloads), UV_PYTHON_DOWNLOADS_JSON_URL=str(metadata),
              UV_PYTHON_CPYTHON_BUILD=entry["build"], UV_CACHE_DIR=os.environ["UV_CACHE_DIR"],
              UV_PYTHON_INSTALL_BIN="0", UV_PYTHON_INSTALL_REGISTRY="0", UV_PYTHON_NO_REGISTRY="1")
          subprocess.run([sys.executable, "-m", "uv", "--no-config", "python", "install", key],
                         env=environment, check=True, timeout=180)
          base = downloads / key
          assert (base / "BUILD").read_text(encoding="utf-8").strip() == entry["build"]
          assert (base / "python.exe").is_file()
          subprocess.run([sys.executable, "-m", "uv", "--no-config", "venv", "--no-project", "--managed-python",
                          "--no-python-downloads", "--python", key, str(virtual)],
                         env=environment, check=True, timeout=60)
          with Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as stream:
              stream.write(str(virtual / "Scripts") + "\n")
          PY
      - name: 确认原生宿主
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "src"))
          from engineering_assistant.platforms.native_launcher import host_target
          assert sys.version_info[:3] == (3, 13, 13), sys.version
          assert host_target() == os.environ["EA_CI_TARGET"]
          root = Path(os.environ["EA_CI_ROOT"])
          report = {
              "target": host_target(), "os": platform.platform(), "python": platform.python_version(),
              "agent_host_qualification": "not_run",
              "windows11_qualification": "not_run" if sys.platform == "win32" else "not_applicable",
              "note": "Windows Server CI does not qualify Windows 11 or an authenticated Agent session.",
          }
          (root / "host.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - name: 安装开发包
        run: |
          python - <<'PY'
          import subprocess
          import sys
          command = (["uv", "--no-config", "pip", "install", "--python", sys.executable, "-e", "."]
                     if sys.platform == "win32" else
                     [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "-e", "."])
          subprocess.run(command, check=True)
          PY
      - name: Windows Provider 启动检查
        id: windows_provider_startup
        if: matrix.target == 'windows-x64'
        run: |
          python - <<'PYTHON'
          import subprocess
          import sys
          for mode in ("--diagnose-console", "--diagnose-loader"):
              diagnostic = subprocess.run([
                  sys.executable, "-m", "engineering_assistant.platforms.provider_sandbox_windows", mode,
              ], timeout=120, check=False)
              print("Windows startup diagnostic exit:", mode, diagnostic.returncode, flush=True)
          native_diagnostic = subprocess.run([
              sys.executable, "scripts/diagnose_windows_native.py",
          ], timeout=180, check=False)
          print("Windows native DLL diagnostic exit:", native_diagnostic.returncode, flush=True)
          subprocess.run([
              sys.executable, "-m", "unittest", "discover", "-s", "tests",
              "-p", "test_provider_runtime.py", "-k",
              "test_windows_lpac_keeps_temporary_and_profile_options_in_private_work", "-v",
          ], check=True)
          PYTHON
      - name: Windows 启动失败后的独立 Hook、启动器与存储回归
        if: matrix.target == 'windows-x64' && failure() && steps.windows_provider_startup.outcome == 'failure'
        run: |
          python - <<'PYTHON'
          import unittest
          suite = unittest.TestSuite()
          loader = unittest.TestLoader()
          for pattern in (
              "test_windows_hooks.py", "test_native_launcher.py",
              "test_windows_artifact_fs.py",
          ):
              suite.addTests(loader.discover("tests", pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYTHON
      - name: Windows 启动失败后验证实际 uv Runtime（保留原失败门禁）
        if: matrix.target == 'windows-x64' && failure() && steps.windows_provider_startup.outcome == 'failure'
        timeout-minutes: 13
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from engineering_assistant.platforms.windows_process import run_bounded_windows
          root = Path(os.environ["EA_CI_ROOT"]) / "windows-uv-attempt"
          root.mkdir()
          report_path = root / "uv-runtime-qualification.json"
          attempt_path = root / "attempt.json"
          attempt = {"actions_startup": "failed", "production_runtime": "running",
              "overall_gate": "blocked", "runtime_distribution": "uv_managed",
              "timeout_seconds": 720, "output_limit_bytes": 1048576}
          attempt_path.write_text(json.dumps(attempt) + "\n", encoding="utf-8")
          code = 1
          try:
              code, output = run_bounded_windows([
                  str(Path(sys.executable).resolve()),
                  str(Path("scripts/qualify_installation.py").resolve()),
                  "--output", str(report_path),
                  "--diagnose-windows-native-on-failure", "--agent", "codex",
              ], cwd=Path.cwd(), environment=dict(os.environ),
                  timeout_seconds=720, output_limit_bytes=1048576)
              (root / "attempt.log").write_bytes(output)
              attempt["exit_code"] = code
              attempt["output_bytes"] = len(output)
              if code == 0:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  if (report.get("status") != "runtime_qualified"
                          or report.get("target") != "windows-x64"
                          or {item.get("agent") for item in report.get("results", [])}
                          != {"codex"}):
                      raise ValueError("unexpected Runtime qualification result")
                  attempt["production_runtime"] = "qualified"
              else:
                  attempt["production_runtime"] = "failed"
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              attempt["production_runtime"] = "failed"
              attempt["error_type"] = type(error).__name__
              code = 1
          attempt_path.write_text(json.dumps(attempt) + "\n", encoding="utf-8")
          print(json.dumps(attempt), flush=True)
          raise SystemExit(code)
          PYTHON
      - name: 全量回归与不可跳过的原生安全验证
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import unittest
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "tests"))
          sys.path.insert(0, str(Path.cwd() / "src"))
          from engineering_assistant.runtime.provider_runtime import ProviderExecutor
          from engineering_assistant.tools.release_assets import required_native_tests

          def require_native_test_results(result, required, discovered):
              skipped = {test.id() for test, _reason in result.skipped} & required
              missing = required - discovered
              if not required or missing or skipped or not result.wasSuccessful():
                  raise SystemExit(f"native qualification failed: missing={sorted(missing)}, skipped={sorted(skipped)}, suite_passed={result.wasSuccessful()}")

          def test_ids(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from test_ids(item)
                  else:
                      yield item.id()

          required = set(required_native_tests(os.environ["EA_CI_TARGET"]))
          loader = unittest.TestLoader()
          suite = loader.discover("tests")
          discovered = set(test_ids(suite))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          require_native_test_results(result, required, discovered)
          report = {
              "target": os.environ["EA_CI_TARGET"], "test_count": result.testsRun,
              "native_tests": sorted(required), "required_native_skips": 0,
              "provider_capability": ProviderExecutor.sandbox_capability(),
              "agent_host_qualification": "not_run",
          }
          (Path(os.environ["EA_CI_ROOT"]) / "native-tests.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - name: 校验作者源
        run: ea validate --require-sources
      - name: 执行真实核心评测
        run: ea eval
      - name: 构建通用安装工具 wheel
        if: matrix.target == 'macos-arm64'
        run: |
          uv build --wheel --out-dir "$EA_CI_ROOT/setup"
          python scripts/verify_setup_wheel.py --wheel "$EA_CI_ROOT"/setup/*.whl --output "$EA_CI_ROOT/setup/wheel-verification.json"
      - name: 构建原生 Codex 包并执行固定官方校验
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from engineering_assistant.tools.compiler import build_package, verify_package
          from engineering_assistant.tools.official_validation import validate_with_official_tools
          repository = Path.cwd()
          root = Path(os.environ["EA_CI_ROOT"])
          for platform in ("codex",):
              package = root / platform
              build_package(repository, platform, package, target=os.environ["EA_CI_TARGET"])
              verify_package(package)
          report = validate_with_official_tools(repository, root / "codex")
          assert report["codex_payload_digest"] == verify_package(root / "codex")["payload_digest"]
          (root / "official-validation.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - name: 固定 Codex Runtime 与 MCP、Hook、Provider 实际集成资格
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.qualify_installation import qualify
          root = Path(os.environ["EA_CI_ROOT"])
          base = root / "runtime-check"
          base.mkdir()
          report = qualify(base, ("codex",), packages={"codex": root / "codex"})
          (root / "runtime-qualification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - name: 绑定本次源码与 CI 验证身份
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["EA_SOURCE_COMMIT"]
          subprocess.run(["git", "diff", "--exit-code", "HEAD"], check=True)
          identity = {"repository": os.environ["EA_CI_REPOSITORY"], "run_id": os.environ["EA_CI_RUN_ID"],
                      "run_attempt": int(os.environ["EA_CI_RUN_ATTEMPT"])}
          root = Path(os.environ["EA_CI_ROOT"])
          names = ["host.json", "native-tests.json", "runtime-qualification.json", "official-validation.json"]
          if os.environ["EA_CI_TARGET"] == "macos-arm64":
              names.append("setup/wheel-verification.json")
          for name in names:
              path = root / name
              report = json.loads(path.read_text(encoding="utf-8"))
              report.update(source_commit=source, ci_identity=identity)
              path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - name: 保存本次原生验证产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-assistant-${{ matrix.target }}
          path: ${{ runner.temp }}/ea-ci/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  assemble-candidate:
    name: 组装经过矩阵检查的发行候选
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
      - name: 安装组装工具
        run: python -m pip install --disable-pip-version-check -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: engineering-assistant-*
          path: ${{ runner.temp }}/ea-matrix
      - name: 校验并组装候选（不创建发行 tag 或 Release）
        env:
          EA_MATRIX_ROOT: ${{ runner.temp }}/ea-matrix
          EA_CANDIDATE_ROOT: ${{ runner.temp }}/ea-candidate
        run: |
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          from engineering_assistant.tools.release_assets import INTERNAL_TARGETS, assemble_release
          from engineering_assistant.runtime.version import CANONICAL_VERSION
          matrix = Path(os.environ["EA_MATRIX_ROOT"])
          artifacts = {target: matrix / ("engineering-assistant-" + target) for target in INTERNAL_TARGETS}
          wheels = list((artifacts["macos-arm64"] / "setup").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("exactly one verified setup wheel is required")
          output = Path(os.environ["EA_CANDIDATE_ROOT"])
          index = assemble_release(artifacts, wheels[0], output, source_commit=os.environ["GITHUB_SHA"],
              ci_identity={"repository": os.environ["GITHUB_REPOSITORY"], "run_id": os.environ["GITHUB_RUN_ID"],
                           "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])})
          assert index["status"] == "candidate"
          assert index["canonical_version"] == CANONICAL_VERSION
          assert index["support_qualification"]["status"] == "not_satisfied"
          # A formal internal version is still only a candidate here. Real
          # App/CLI/Provider and frozen HTTPS installation acceptance precede
          # prepare/activate; CI does not create tags, Releases, or the alias.
          # Artifact transport drops executable modes; TAR retains the native
          # launcher's mode and the ZIP entries also carry explicit permissions.
          with tarfile.open(output.parent / "engineering-assistant-candidate.tar.gz", "w:gz") as archive:
              archive.add(output, arcname="engineering-assistant-candidate")
          PY
      - name: 保存可供人工审查的候选包
        uses: actions/upload-artifact@v4
        with:
          name: engineering-assistant-candidate
          path: ${{ runner.temp }}/engineering-assistant-candidate.tar.gz
          if-no-files-found: error
          retention-days: 14
