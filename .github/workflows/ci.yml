name: 核心验证

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装开发包
        run: python -m pip install -e .
      - name: 运行回归测试
        run: python -m unittest discover -s tests -v
      - name: 校验作者源
        run: ea validate --require-sources
      - name: 执行真实核心评测
        run: ea eval
      - name: 构建并校验双平台临时包
        shell: bash
        run: |
          root="$(mktemp -d)"
          ea build --platform codex --output "$root/codex"
          ea verify-package --package "$root/codex"
          ea build --platform hermes --output "$root/hermes"
          ea verify-package --package "$root/hermes"
      - name: 演练本机发布脚本
        run: python scripts/publish_local.py --platform all --dry-run
