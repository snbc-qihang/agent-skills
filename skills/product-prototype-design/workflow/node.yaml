{
  "node_id": "product-prototype-design",
  "stage": "product_prototype_design",
  "skill_id": "product-prototype-design",
  "version": "3.1.0",
  "mode": "standalone|workflow",
  "entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "depends_on": [],
  "inputs": [
    "requirement-contract.json",
    "repo-context-report.md",
    "brand_or_design_system_context",
    "target_viewports"
  ],
  "outputs": [
    "product-prototype-contract.json",
    "prototype-source.md",
    "desktop-prototype-screenshot.png",
    "mobile-prototype-screenshot.png",
    "interaction-state-map.json",
    "third-party-capability-ledger.json"
  ],
  "preconditions": [
    "contract 输入可用",
    "风险策略已加载"
  ],
  "postconditions": [
    "StageRunResult 已输出",
    "产物已登记索引"
  ],
  "quality_gates": [
    "高保真原型存在",
    "桌面和移动截图存在",
    "核心用户流完整",
    "加载/空态/错误态/权限态完整",
    "第三方能力调用已登记"
  ],
  "approval_policy": {
    "required_for": [
      "跳过原型门禁",
      "使用非项目既有设计系统",
      "核心信息架构变更"
    ],
    "decision": [
      "pending",
      "approved",
      "rejected"
    ]
  },
  "retry_policy": {
    "max_attempts": 1,
    "retry_on": [
      "TOOL_UNAVAILABLE",
      "UNKNOWN_ERROR"
    ]
  },
  "failure_policy": {
    "block_on": [
      "QUALITY_GATE_FAILED",
      "RISK_POLICY_VIOLATION",
      "STAGE_RESULT_CONTRACT_VIOLATION"
    ],
    "pause_on": [
      "HUMAN_APPROVAL_REQUIRED",
      "MISSING_REQUIRED_INPUT"
    ]
  },
  "next_nodes": [],
  "artifact_mapping": {
    "product-prototype-contract.json": "artifacts/product-prototype-design/product-prototype-contract.json",
    "prototype-source.md": "artifacts/product-prototype-design/prototype-source.md",
    "desktop-prototype-screenshot.png": "artifacts/product-prototype-design/desktop-prototype-screenshot.png",
    "mobile-prototype-screenshot.png": "artifacts/product-prototype-design/mobile-prototype-screenshot.png",
    "interaction-state-map.json": "artifacts/product-prototype-design/interaction-state-map.json",
    "third-party-capability-ledger.json": "artifacts/product-prototype-design/third-party-capability-ledger.json"
  }
}
