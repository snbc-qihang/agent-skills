display_name: "Skill Quality Auditor"
short_description: "审计 skills 质量，防止空泛 prompt，阻断不合格 skill 入库。"
default_prompt: "使用 skill-quality-auditor，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "高风险 skill 入库"
    - "修改高风险质量门禁"
    - "skill gate 豁免"
metadata:
  owner: "skill owner"
  stage: "skill_quality"
  type: "audit_skill"
  trigger_description: "Use when 审计 skills 质量，防止空泛 prompt，阻断不合格 skill 入库；Do not use when do not 执行业务研发阶段。"
routing:
  intent_tags:
    - "audit_skill"
    - "auditor"
    - "prompt"
    - "quality"
    - "skill"
    - "skill-quality-auditor"
    - "skill_quality"
    - "skills"
    - "入库。"
    - "审计"
    - "质量"
    - "防止空泛"
  allow_implicit_invocation: true
  cost_class: "medium"
