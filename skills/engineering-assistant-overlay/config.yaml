artifact_policy:
  default_root: "~/.codex/run-artifacts/engineering-assistant"
  default_mode: "ephemeral"
  target_repo_write_allowed_by_default: false
  overlay_growth_budget:
    skill_md_soft_lines: 500
    skill_md_hard_lines: 650
    upgrade_summary_soft_lines: 220
    upgrade_summary_hard_lines: 400
    reference_soft_lines: 200
    reference_hard_lines: 400
  process_artifact_retention_days:
    normal_development: 7
    complex_multi_repo: 14
    failed_or_darwin_triggered: 14
  keep_after_cleanup:
    - required-information-requests.json
    - window-plan.json
    - window-registry.json
    - window-reconciliation-ledger.json
    - dispatch-ledger.json
    - window-status-ledger.json
    - coordination-summary.md
    - council-plan.json
    - council-member-outputs.json
    - council-decision.json
    - assistant-run-feedback.json
    - assistant-run-feedback.summary.md
    - closed-loop-outcome.json
    - closed-loop-outcome.summary.md
    - minimal-evidence-index.json

capability_assimilation:
  sole_entrypoint: engineering-assistant
  sole_gate_owner: engineering-assistant
  active_pack: ea-agent-skills-delta
  active_local_version: "1.5.0"
  versioning_mode: independent
  upgrade_policy: explicit_local_version_upgrade_after_audit
  upstream_commit_tracking: false
  automatic_upstream_overwrite: false
  acceptance:
    case_count: 28
    minimum_overall_pass_rate: 0.8
    require_all_g0: true
    maximum_existing_gate_regressions: 0

