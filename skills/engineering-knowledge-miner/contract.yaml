    "upgrade_conditions": [
      "修改正式团队规范",
      "rule_candidate 标记为 approved",
      "修改高风险 skill quality gate"
    ],
    "default_for_unknown": "medium"
  },
  "quality_gates": [
    {
      "gate_id": "engineering-knowledge-miner-gate-1",
      "name": "每条经验有来源证据",
      "type": "deterministic",
      "pass_condition": "每条经验有来源证据 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "engineering-knowledge-miner-gate-2",
      "name": "规则默认 candidate",
      "type": "deterministic",
      "pass_condition": "规则默认 candidate 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "engineering-knowledge-miner-gate-3",
      "name": "owner 和适用范围明确",
      "type": "deterministic",
      "pass_condition": "owner 和适用范围明确 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "engineering-knowledge-miner-gate-4",
      "name": "反哺路径明确",
      "type": "deterministic",
      "pass_condition": "反哺路径明确 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    }
  ],
  "failure_modes": [
    {
      "error_code": "MISSING_REQUIRED_INPUT",
      "condition": "必填输入不可用",
      "severity": "major",
      "recovery_strategy": "输出缺失信息产物并等待补充输入",
      "next_state": "waiting_for_input"
    },
    {
      "error_code": "INVALID_OUTPUT_SCHEMA",
      "condition": "输出无法按声明 schema 解析",
      "severity": "blocker",
      "recovery_strategy": "重新生成产物并再次运行校验器",
      "next_state": "failed"
    },
    {
      "error_code": "STAGE_RESULT_CONTRACT_VIOLATION",
      "condition": "StageRunResult 缺少语言、文档编号、主动问询或其他运行时门禁字段",
      "severity": "blocker",
      "recovery_strategy": "运行 validate_stage_run_result.py 并阻断违规节点",
      "next_state": "blocked"
    },
    {
      "error_code": "QUALITY_GATE_FAILED",
      "condition": "阻断门禁失败",
      "severity": "blocker",
      "recovery_strategy": "输出 findings 和 required actions",
      "next_state": "blocked"
    },
    {
      "error_code": "HUMAN_APPROVAL_REQUIRED",
      "condition": "风险策略要求人工审批",
      "severity": "major",
      "recovery_strategy": "创建 ApprovalRequest",
      "next_state": "waiting_for_human_review"
    }
  ],
