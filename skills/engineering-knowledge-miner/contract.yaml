  "postconditions": [
    "blocking 信息缺失时已暂停在 waiting_for_input，且只登记补充信息请求、human-review HTML 和恢复点",
    "blocking 信息已补齐时全部正式输出产物已生成并登记",
    "质量门禁已评估",
    "需要人工审批的事项已列出"
  ],
