    "preflight_sequence": [
      "读取用户请求",
      "读取仓库上下文",
      "读取 profile",
      "读取上游产物",
      "读取 artifact index",
      "区分可自动推导信息与必须用户确认信息",
      "blocking 缺失项先问询并暂停",
      "补充答案写回后再生成正式产物"
    ],
    "preflight_state_field": "preflight_input_state",
    "preflight_state_values": [
