display_name: "Frontend Development"
short_description: "基于前端设计和接口契约实施页面、组件、状态和接口联调变更。"
default_prompt: "使用 frontend-development，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "公共组件改造"
    - "前端技术栈或组件库变更"
    - "影响核心客户端流程"
metadata:
  owner: "前端开发"
  stage: "frontend_development"
  type: "stage_skill"
  trigger_description: "Use when 已通过 prototype review 且 frontend-design 已冻结，需要实现页面、组件、状态和联调时；Do not use when do not凭组件文档或接口文档绕过高保真原型。"
routing:
  intent_tags:
    - "development"
    - "frontend"
    - "frontend-development"
    - "frontend_development"
    - "stage_skill"
    - "基于前端设计和接口契约实施页面"
    - "状态和接口联调变更。"
    - "组件"
  allow_implicit_invocation: true
  cost_class: "medium"
