      "specialty_reference_only": {
        "database-design.md": "数据库设计",
        "mq-design.md": "MQ 设计",
        "redis-design.md": "Redis 设计",
        "interface-contracts.yaml": "接口契约",
        "test-strategy.md": "测试策略"
      },
      "evidence_location": [
        "stage-run-result.json",
        "repo-context-report.md",
        "review evidence artifacts"
      ],
      "technology_selection_location": [
        "high-level-design.md",
        "technology-selection-review.md",
        "repo-context-report.md"
