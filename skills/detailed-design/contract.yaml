{
  "skill_id": "detailed-design",
  "skill_name": "Detailed Design",
  "version": "1.0.0",
  "stage": "detailed_design",
  "type": "stage_skill",
  "purpose": "将概要设计拆解为可实现的详细设计、接口契约、任务清单和测试策略。",
  "non_goals": [
    "不批准设计进入研发",
    "不直接修改代码",
    "不省略专项设计"
  ],
  "trigger_description": "Use when the request is about 将概要设计拆解为可实现的详细设计、接口契约、任务清单和测试策略。；Do not use when 不批准设计进入研发；不直接修改代码。",
  "routing": {
    "intent_tags": [
      "design",
      "detailed",
      "detailed-design",
      "detailed_design",
      "stage_skill",
      "任务清单和测试策略。",
      "将概要设计拆解为可实现的详细设计",
      "接口契约"
    ],
    "positive_triggers": [
      "detailed-design",
      "Detailed Design",
      "将概要设计拆解为可实现的详细设计、接口契约、任务清单和测试策略。"
    ],
    "negative_triggers": [
      "只解释 Detailed Design 的用途，不执行任务",
      "只咨询说明",
      "不生成产物"
    ],
    "requires": [
      "high-level-design.md",
      "architecture-decision-record.md",
      "module-boundary.yaml",
      "team_standards"
    ],
    "conflicts_with": [],
    "risk_level": "medium",
    "cost_class": "medium",
    "evidence_required": [
      "主详细设计只保留功能实现主线",
      "专项设计独立成文并在主文档引用",
      "流程使用 flowchart 且紧跟流程设计说明",
      "DDD/分层/扩展点方案包含 classDiagram",
      "测试策略覆盖主干和异常路径"
    ],
    "allow_implicit_invocation": true
  },
  "standalone_mode": "读取输入、校验前置条件、在指定输出目录生成全部声明产物，并在阻断门禁处停止。",
  "workflow_mode": "消费 StageRunRequest 中的上游产物，输出 StageRunResult，并把声明产物路由给下游 workflow 节点。",
  "language_policy": {
    "supported": [
      "zh-CN",
      "en"
    ],
    "when_unspecified": "ask_user",
    "blocking_status": "waiting_for_input",
    "question": "请确认输出语言：简体中文还是 English？",
    "writeback": "StageRunRequest.context.language"
  },
  "technology_selection_policy": {
    "categories": [
      "backend_framework",
      "persistence_framework",
      "frontend_stack",
      "component_library",
      "middleware",
      "test_framework",
      "build_tool",
      "observability",
      "deployment"
    ],
    "must_confirm_when": [
      "设计未声明技术选型",
      "repo_context 未识别现有技术栈",
      "生成代码需要选择后端/持久化/前端/组件库/测试/构建框架",
      "拟使用与现有项目不一致的技术"
    ],
    "ask_user_when_unspecified": true,
    "team_defaults": {
      "java_spring_persistence": "mybatis-plus"
    },
    "requires_review": [
      "JDBC",
      "框架替换",
      "绕过现有 mapper/repository 模式",
      "前端技术栈或组件库变更",
      "测试框架替换",
      "构建工具替换",
      "中间件替换"
    ],
    "writeback": "StageRunRequest.context.technology_selection"
  },
  "team_adaptation_policy": {
    "profile_id": "rrq-yq-team",
    "profile_path": "engineering-assistant/profiles/rrq-yq-team.yaml",
    "source_catalog": "engineering-assistant/registry/team-standard-sources.yaml",
    "rule_prefixes": [
      "RRQ",
      "YAPI",
      "YQ"
    ],
    "must_load_before_work": [
      "team-rule-catalog.yaml",
      "team-standard-sources.yaml",
      "rrq-yq-team.yaml"
    ],
    "fallback": "如果目标项目 profile 与团队默认 profile 冲突，优先使用目标项目 profile，并把冲突作为 finding 或 required_information_requests 输出。"
  },
