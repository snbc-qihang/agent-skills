      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    },
    {
      "name": "database-design.md",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/detailed-design/database-design.md",
      "schema": "output.schema.json#database-design.md",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    },
    {
      "name": "mq-design.md",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/detailed-design/mq-design.md",
      "schema": "output.schema.json#mq-design.md",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    },
    {
      "name": "redis-design.md",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/detailed-design/redis-design.md",
      "schema": "output.schema.json#redis-design.md",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    }
  ],
  "preconditions": [
    "必填输入已提供或已记录缺失处理策略",
    "风险策略已加载",
    "目标范围已明确"
  ],
  "execution_gates": {
    "language_confirmed": true,
    "preflight_required_information": true,
    "formal_document_metadata_required": true,
    "stage_result_validation_required": true,
    "block_when_agent_violates_contract": true
  },
  "required_information_policy": {
    "must_ask_when": [
      "必填输入缺失",
      "系统边界无法确认",
      "风险等级无法判断",
      "审批状态缺失",
      "无法基于仓库或上游产物可靠推导"
    ],
    "question_output": "required_information_requests",
    "blocking_status": "waiting_for_input",
    "human_review_html_required": true,
    "human_review_html_requirements": [
      "可填写每个待确认项",
      "保留问题 id 或稳定序号",
      "可复制或下载答案 JSON",
      "登记到 StageRunResult.artifacts",
      "HTML 路径必须位于目标项目 docs/human-review/",
      "agent 只消费 MD/JSON/YAML，不把 HTML 作为事实输入源"
    ],
    "minimum_question_fields": [
      "id",
      "question",
      "reason",
      "required",
      "priority",
      "expected_format"
    ],
    "question_order": [
      "critical",
      "major",
      "minor"
    ],
    "do_not_ask_when": "信息可从当前仓库、上游产物、明确 profile 或已确认上下文可靠获得时，不重复询问用户。"
  },
  "postconditions": [
    "全部输出产物已生成，或已输出明确的阻断结果",
    "质量门禁已评估",
    "需要人工审批的事项已列出"
  ],
  "dependencies": [
    "团队规范",
    "文档模板",
    "仓库上下文",
    "风险策略",
    "校验脚本"
  ],
  "permissions": {
    "allowed_actions": [
      "读取仓库文件",
      "生成产物",
      "运行确定性校验",
      "请求人工审批"
    ],
    "forbidden_actions": [
      "执行生产变更",
      "自动批准高风险动作",
      "隐藏失败检查",
      "覆盖无关工作"
    ]
  },
  "human_approval_required": [
    "核心链路事务边界变化",
    "高并发路径设计",
    "权限/认证/鉴权设计",
    "DDL",
    "MQ 新队列或 topic",
    "Redis 新 Key"
  ],
  "risk_model": {
    "levels": [
      "low",
      "medium",
      "high",
      "critical"
    ],
    "upgrade_conditions": [
      "核心链路事务边界变化",
      "高并发路径设计",
      "权限/认证/鉴权设计",
      "DDL",
      "MQ 新队列或 topic",
      "Redis 新 Key"
    ],
    "default_for_unknown": "medium"
  },
  "quality_gates": [
    {
      "gate_id": "detailed-design-gate-1",
      "name": "主详细设计只保留功能实现主线",
      "type": "deterministic",
      "pass_condition": "主详细设计只保留功能实现主线 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "detailed-design-gate-2",
      "name": "专项设计独立成文并在主文档引用",
      "type": "deterministic",
      "pass_condition": "专项设计独立成文并在主文档引用 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "detailed-design-gate-3",
      "name": "流程使用 flowchart 且紧跟流程设计说明",
      "type": "deterministic",
      "pass_condition": "流程使用 flowchart 且紧跟流程设计说明 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "detailed-design-gate-4",
      "name": "DDD/分层/扩展点方案包含 classDiagram",
      "type": "deterministic",
      "pass_condition": "DDD/分层/扩展点方案包含 classDiagram 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "detailed-design-gate-5",
      "name": "测试策略覆盖主干和异常路径",
      "type": "deterministic",
      "pass_condition": "测试策略覆盖主干和异常路径 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    }
  ],
  "failure_modes": [
    {
      "error_code": "MISSING_REQUIRED_INPUT",
      "condition": "必填输入不可用",
      "severity": "major",
      "recovery_strategy": "输出缺失信息产物并等待补充输入",
      "next_state": "waiting_for_input"
    },
    {
      "error_code": "INVALID_OUTPUT_SCHEMA",
      "condition": "输出无法按声明 schema 解析",
      "severity": "blocker",
      "recovery_strategy": "重新生成产物并再次运行校验器",
      "next_state": "failed"
    },
    {
      "error_code": "STAGE_RESULT_CONTRACT_VIOLATION",
      "condition": "StageRunResult 缺少语言、文档编号、主动问询或其他运行时门禁字段",
      "severity": "blocker",
      "recovery_strategy": "运行 validate_stage_run_result.py 并阻断违规节点",
      "next_state": "blocked"
    },
    {
      "error_code": "QUALITY_GATE_FAILED",
      "condition": "阻断门禁失败",
      "severity": "blocker",
      "recovery_strategy": "输出 findings 和 required actions",
      "next_state": "blocked"
    },
    {
      "error_code": "HUMAN_APPROVAL_REQUIRED",
      "condition": "风险策略要求人工审批",
      "severity": "major",
      "recovery_strategy": "创建 ApprovalRequest",
      "next_state": "waiting_for_human_review"
    }
  ],
  "eval_cases": [
    "happy_path",
    "missing_required_input",
    "ambiguous_input",
    "policy_conflict",
    "edge_case",
    "regression_case",
    "technology_demo_adoption",
    "control_plane_drift",
    "rule_consumption_gap",
    "context_noise_overload",
    "low_quality_automation"
  ],
  "workflow_interface": {
    "node_id": "detailed-design",
    "input_artifacts": [
      "high-level-design.md",
      "architecture-decision-record.md",
      "module-boundary.yaml",
      "team_standards"
    ],
    "output_artifacts": [
      "detailed-design.md",
      "implementation-plan.md",
      "interface-contracts.yaml",
      "test-strategy.md",
      "database-design.md",
      "mq-design.md",
      "redis-design.md"
    ],
    "document_metadata": {
      "schema": "engineering-assistant/schemas/document-lifecycle.schema.json",
      "required_when": "status=succeeded and markdown artifact exists"
    },
    "required_information_requests": {
      "artifact": "artifacts/detailed-design/required-information-request.json",
      "schema": "engineering-assistant/schemas/required-information-request.schema.json",
      "status_when_blocking": "waiting_for_input"
    },
    "state_transitions": [
      "pending",
      "running",
      "waiting_for_input",
      "waiting_for_human_review",
      "succeeded",
      "failed",
      "skipped",
      "blocked",
      "cancelled"
    ],
    "gate_decision": [
      "continue",
      "pause",
      "retry",
      "skip",
      "block",
      "stop"
    ],
    "retry_policy": {
      "max_attempts": 1,
      "retry_on": [
        "TOOL_UNAVAILABLE",
        "UNKNOWN_ERROR"
      ]
    }
  },
  "owner": "后端开发",
  "reviewers": [
    "研发负责人",
    "架构师",
    "测试负责人"
  ],
  "change_policy": "contract、gate、schema 或审批规则变更必须经过 skill owner 评审，并通过 skill-quality-auditor",
  "team_document_policy": {
    "scope": "团队详细设计主文档按输入详细设计规范组织，证据、选型、专项展开和发布灰度内容必须拆出。",
    "main_document": {
      "artifact": "detailed-design.md",
      "canonical_template": "skills/detailed-design/assets/detailed-design-template.md",
      "source_template": "inputs/详细设计规范.md",
      "template_usage_policy": {
        "required": true,
        "source_of_truth": "template_assets[].canonical_template",
        "must_read_template_before_generation": true,
        "template_assets": [
          {
            "artifact": "detailed-design.md",
            "template": "assets/detailed-design-template.md",
            "canonical_template": "skills/detailed-design/assets/detailed-design-template.md",
            "source_template": "inputs/详细设计规范.md",
            "selection": "详细设计主文档正文"
          }
        ],
        "generation_protocol": [
          "生成正式 Markdown 文档前必须先读取对应 skill 的 assets template 文件，不得凭记忆、通用模板或聊天上下文替代。",
          "以 template 原文作为唯一正文骨架，保留 frontmatter、标题层级、章节顺序、表格列头、固定提示块和格式约定。",
          "只允许替换占位符、补充空白单元格和在既有章节下填充输入事实；不得删除、压缩、合并、重命名或重排模板章节。",
          "输入材料缺少事实时，保留模板章节并写明不适用原因，或进入 waiting_for_input 并输出 required_information_requests。",
          "不得用 assets/artifact-template.md 的证据/Findings/门禁决策骨架替代正式设计正文。",
          "模板文件不存在、无法读取或输出无法通过模板校验时，StageRunResult.status 必须为 blocked 或 failed。"
        ],
        "strict_format_rules": [
          "保留模板原有章节、标题名称、标题层级、表格列头和固定提示块。",
          "不适用章节不得删除，必须写明不适用原因或等待用户补充事实。",
          "不得把团队 template 压缩成摘要、检查清单或通用证据报告。",
          "不得把 source_template 只当参考风格；canonical_template 才是输出正文骨架。"
        ],
        "blocked_when": [
          "未读取 template asset 就生成正式 Markdown 文档",
          "输出缺少 template 章节、列头、固定提示块或顺序",
          "用 assets/artifact-template.md 或通用报告格式替代正式设计正文",
          "缺少关键事实却填充待确认占位符并标记 succeeded"
        ]
      },
      "allowed_sections": [
        "1. 修订历史",
        "2. 设计背景与目标摘要",
        "2.1 原始需求与原型引用矩阵",
        "3. 模块/功能详细设计",
        "3.1. 业务流程图",
        "3.2. UML类图",
        "4. 数据库设计",
        "5. 接口定义",
        "5.1. API接口列表",
        "5.2. 中间件设计",
        "6. 单元测试",
        "7. 性能与扩展性设计",
        "8. 人工评审项"
      ],
      "forbidden_headings": [
