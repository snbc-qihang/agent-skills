display_name: "Code Review"
short_description: "对代码进行人工评审辅助，按问题、证据、影响、级别、建议和阻断状态输出。"
default_prompt: "使用 code-review，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "blocker 关闭"
    - "高风险人工豁免"
    - "核心链路评审通过"
metadata:
  owner: "研发负责人"
  stage: "code_review"
  type: "stage_skill"
  trigger_description: "Use when the request is about 对代码进行人工评审辅助，按问题、证据、影响、级别、建议和阻断状态输出。；Do not use when 不替代 code-quality-governor；不输出无证据建议。"
routing:
  intent_tags:
    - "code"
    - "code-review"
    - "code_review"
    - "review"
    - "stage_skill"
    - "对代码进行人工评审辅助"
    - "建议和阻断状态输出。"
    - "影响"
    - "按问题"
    - "级别"
    - "证据"
  allow_implicit_invocation: true
  cost_class: "medium"
