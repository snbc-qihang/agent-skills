display_name: "Code Review"
short_description: "对代码进行人工评审辅助，按问题、证据、影响、级别、建议和阻断状态输出。"
default_prompt: "使用 code-review，先确认输出语言和必须补充的信息，再基于输入材料执行本阶段任务，输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "blocker 关闭"
    - "高风险人工豁免"
    - "核心链路评审通过"
metadata:
  owner: "研发负责人"
  stage: "code_review"
  type: "stage_skill"
  trigger_description: "Use when 质量报告和变更文件已具备，需要做语义代码评审、定位缺陷和整理 blocker 清单时；Do not use when do not替代 code-quality-governor。"
routing:
  intent_tags:
    - "code"
    - "code-review"
    - "code_review"
    - "review"
    - "stage_skill"
    - "对代码进行人工评审辅助"
    - "建议和阻断状态输出。"
    - "影响"
    - "按问题"
    - "级别"
    - "证据"
  allow_implicit_invocation: true
  cost_class: "medium"
