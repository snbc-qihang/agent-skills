    "删除字段",
    "删除索引",
    "生产库变更",
    "影响核心链路的索引调整",
    "物理删除在线事实行"
  ],
  "risk_model": {
    "levels": [
      "low",
      "medium",
      "high",
      "critical"
    ],
    "upgrade_conditions": [
      "DDL",
      "数据订正",
      "删除字段",
      "删除索引",
      "生产库变更",
      "影响核心链路的索引调整",
      "物理删除在线事实行"
    ],
    "default_for_unknown": "medium"
  },
  "quality_gates": [
    {
      "gate_id": "database-design-gate-1",
      "name": "database-design.md 使用 OLTP 或 OLAP 团队模板",
      "type": "deterministic",
      "pass_condition": "database-design.md 使用 OLTP 或 OLAP 团队模板 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "database-design-gate-2",
      "name": "字段和索引均有查询/约束用途",
      "type": "deterministic",
      "pass_condition": "字段和索引均有查询/约束用途 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "database-design-gate-3",
      "name": "迁移步骤可回滚",
      "type": "deterministic",
      "pass_condition": "迁移步骤可回滚 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "database-design-gate-4",
      "name": "容量和查询模式已评估",
      "type": "deterministic",
      "pass_condition": "容量和查询模式已评估 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "database-design-gate-5",
      "name": "生产变更审批明确",
      "type": "hybrid",
      "pass_condition": "生产变更审批明确 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "database-design-gate-6",
      "name": "未确认库名/实例/字符集/索引名时不得 final",
      "type": "deterministic",
      "pass_condition": "未确认库名/实例/字符集/索引名时不得 final 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    }
  ],
  "failure_modes": [
    {
      "error_code": "MISSING_REQUIRED_INPUT",
      "condition": "必填输入不可用",
      "severity": "major",
      "recovery_strategy": "输出缺失信息产物并等待补充输入",
      "next_state": "waiting_for_input"
    },
    {
      "error_code": "INVALID_OUTPUT_SCHEMA",
      "condition": "输出无法按声明 schema 解析",
      "severity": "blocker",
      "recovery_strategy": "重新生成产物并再次运行校验器",
      "next_state": "failed"
    },
    {
      "error_code": "STAGE_RESULT_CONTRACT_VIOLATION",
      "condition": "StageRunResult 缺少语言、文档编号、主动问询或其他运行时门禁字段",
      "severity": "blocker",
      "recovery_strategy": "运行 validate_stage_run_result.py 并阻断违规节点",
      "next_state": "blocked"
    },
    {
      "error_code": "QUALITY_GATE_FAILED",
      "condition": "阻断门禁失败",
      "severity": "blocker",
      "recovery_strategy": "输出 findings 和 required actions",
      "next_state": "blocked"
    },
