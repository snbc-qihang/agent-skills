display_name: "Repo Context Miner"
short_description: "从现有仓库中提取设计和研发所需的代码上下文，形成模块地图、接口/数据/中间件使用清单和影响范围。"
default_prompt: "使用 repo-context-miner，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "读取敏感配置"
    - "跨仓库分析"
    - "高风险影响范围确认"
metadata:
  owner: "架构师/资深开发"
  stage: "repo_context"
  type: "stage_skill"
  trigger_description: "Use when 从现有仓库中提取设计和研发所需的代码上下文，形成模块地图、接口/数据/中间件使用清单和影响范围；Do not use when do not 直接修改代码。"
routing:
  intent_tags:
    - "context"
    - "miner"
    - "repo"
    - "repo-context-miner"
    - "repo_context"
    - "stage_skill"
    - "从现有仓库中提取设计和研发所需的代码上下文"
    - "形成模块地图"
    - "接口/数据/中间件使用清单和影响范围。"
  allow_implicit_invocation: true
  cost_class: "medium"
