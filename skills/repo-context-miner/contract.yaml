{
  "skill_id": "repo-context-miner",
  "skill_name": "Repo Context Miner",
  "version": "1.0.0.4",
  "stage": "repo_context",
  "type": "stage_skill",
  "purpose": "从现有仓库中提取设计和研发所需的代码上下文，形成模块地图、接口/数据/中间件使用清单和影响范围。",
  "non_goals": [
    "不直接修改代码",
    "不替代业务设计",
    "不在缺少证据时推断实现细节"
  ],
  "trigger_description": "Use when the request is about 从现有仓库中提取设计和研发所需的代码上下文，形成模块地图、接口/数据/中间件使用清单和影响范围。；Do not use when 不直接修改代码；不替代业务设计。",
  "routing": {
    "intent_tags": [
      "context",
      "miner",
      "repo",
      "repo-context-miner",
      "repo_context",
      "stage_skill",
      "从现有仓库中提取设计和研发所需的代码上下文",
      "形成模块地图",
      "接口/数据/中间件使用清单和影响范围。"
    ],
    "positive_triggers": [
      "repo-context-miner",
      "Repo Context Miner",
      "从现有仓库中提取设计和研发所需的代码上下文，形成模块地图、接口/数据/中间件使用清单和影响范围。"
    ],
    "negative_triggers": [
      "只解释 Repo Context Miner 的用途，不执行任务",
      "只咨询说明",
      "不生成产物"
    ],
    "requires": [
      "repository_path",
      "requirement-contract.json",
      "team_standards",
      "risk_policy"
    ],
    "conflicts_with": [],
    "risk_level": "medium",
    "cost_class": "medium",
    "evidence_required": [
      "仓库路径可访问",
      "模块边界有证据",
      "影响范围明确",
      "可复用能力已登记"
    ],
    "allow_implicit_invocation": true
  },
  "standalone_mode": "先执行 preflight 信息梳理；blocking 信息缺失时仅输出 required_information_requests、human-review HTML 和恢复点，补齐后再在指定输出目录生成全部声明产物。",
  "workflow_mode": "消费 StageRunRequest 中的上游产物，先执行 preflight 信息梳理；blocking 信息缺失时暂停并等待补充写回，补齐后输出 StageRunResult 并把声明产物路由给下游 workflow 节点。",
  "preflight_runtime_gate": {
    "state_field": "preflight_input_state",
    "states": [
      "ready",
      "waiting_for_input",
      "waiting_for_human_review",
      "blocked"
    ],
    "formal_generation_entry_condition": "preflight_input_state == ready",
    "formal_generation_blocked_when": [
      "preflight_input_state != ready",
      "存在 blocking required_information_requests",
      "human-review HTML 已生成但补充答案未写回机读事实源"
    ],
    "waiting_for_input_allowed_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "waiting_for_input_forbidden_formal_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "block_current_node_formal_generation": true,
    "block_next_nodes": true,
    "resume_after_writeback": "StageRunRequest.context、artifact index 或 MD/JSON/YAML 已记录用户补充答案、来源和时间。"
  },
  "lean_runtime_router_policy": {
    "schema": "engineering-assistant/schemas/runtime-route-decision.schema.json",
    "task_kinds": [
      "context",
      "audit",
      "change",
      "release",
      "self_healing"
    ],
    "evidence_levels": [
      "inline",
      "lite",
      "standard",
      "formal"
    ],
    "persistence_modes": [
      "inline",
      "ephemeral",
      "target_repo",
      "blocked"
    ],
    "default_persistence_mode": "ephemeral",
    "capability_decision_required": true,
    "assistant_feedback_required": true,
    "assistant_feedback_schema": "engineering-assistant/schemas/assistant-run-feedback.schema.json",
    "document_spine_required": true,
    "planning_spine_schema": "engineering-assistant/schemas/planning-spine.schema.json",
    "engineering_governance_state_machine_required": true,
    "capability_routing_protocol_required": true,
    "documentation_output_mode": "control_surface_first",
    "quality_contract_runner_required": true,
    "quality_contract_runner": "engineering-assistant/scripts/run_quality_contract.py",
    "agent_execution_monitor_schema": "engineering-assistant/schemas/agent-execution-monitor.schema.json",
    "post_task_plan_alignment_required": true,
    "post_task_plan_alignment_schema": "engineering-assistant/schemas/post-task-plan-alignment.schema.json",
    "policy_source": "workflow-orchestrator.workflow_runtime_policy.lean_runtime_router_policy",
    "full_policy_required_for": false
  },
  "design_governance_policy": {
    "states": [
      "intake_collecting",
      "intake_gap_analysis",
      "waiting_for_user_input",
      "direction_confirming",
      "design_generating",
      "self_reviewing",
      "design_revising",
      "waiting_for_human_review",
      "human_review_processing",
      "design_regenerating",
      "knowledge_mining",
      "tl_rule_candidate_pending",
      "approved_or_done"
    ],
    "formal_design_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "preflight_control_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "document_retention_policy": {
      "persist_allowed_document_classes": [
        "formal_design",
        "formal_decision",
        "formal_index"
      ],
      "transient_only_document_classes": [
        "run_evidence",
        "agent_workspace",
        "process_trace",
        "human_review_packet",
        "human_readable_render",
        "rule_governance"
      ],
      "final_project_document_roots": [
        "docs/00-index/",
        "docs/architecture/",
        "docs/design/",
        "docs/decisions/",
        "docs/release/"
      ],
      "agent_workspace_roots": [
        ".run-artifacts/",
        "artifacts/",
        "artifacts/_control/"
      ],
      "human_review_roots": [
        "docs/human-review/"
      ],
      "human_readable_render_roots": [
        "docs/human-readable/"
      ],
      "completion_rule": "研发完成后只保留 approved/final + persist + formal_* 的确定性设计/决策/索引文档；run evidence、agent workspace、trace、缺失信息、临时评审和 HTML 审阅包不得进入正式留存集合。"
    },
    "document_lifecycle_states": [
      "not_started",
      "draft",
      "ready_for_self_review",
      "self_review_failed",
      "revised",
      "waiting_for_human_review",
      "human_review_rejected",
      "approved",
      "final",
      "superseded",
      "archived",
      "blocked",
      "waiting_for_input"
    ],
    "hard_gates": {
      "information_complete_before_formal_generation": true,
      "direction_confirmed_before_design_generation": true,
      "specialty_scope_confirmed_before_specialty_docs": true,
      "self_review_passed_before_human_review": true,
      "human_review_approved_before_final": true,
      "approved_or_final_before_code_control_surface": true
    },
    "waiting_for_input_policy": {
      "allowed_artifacts": [
        "information-inventory.json",
        "context-source-map.json",
        "missing-information-list.json",
        "required-information-request.json",
        "design-objective-plan.md",
        "scope-and-non-goals.yaml",
        "user-confirmed-facts.json",
        "design-direction-decision.md",
        "docs/human-review/<run-id>.html",
        "workflow-trace.json",
        "resume-point.json"
      ],
      "forbidden_artifacts": [
        "high-level-design.md",
        "detailed-design.md",
        "database-design.md",
        "redis-design.md",
        "mq-design.xlsx",
        "interface-contracts.yaml",
        "test-strategy.md"
      ],
      "must_not_register_formal_artifacts_as_completed": true,
      "resume_requires_writeback_to_machine_readable_source": true
    },
    "review_feedback_policy": {
      "classification_required": true,
      "classes": [
        "fact_completion",
        "direction_change",
        "document_defect",
        "standard_violation",
        "team_rule_candidate"
      ],
      "default_update_strategy": "incremental_patch_affected_artifacts",
      "full_regeneration_allowed_when": [
        "architecture_direction_changed",
        "data_model_changed",
        "interface_boundary_changed",
        "message_model_changed"
      ],
      "full_regeneration_requires": [
        "impact_analysis",
        "supersede_previous_version",
        "workflow_trace_reason"
      ]
    },
    "self_review_policy": {
      "layers": [
        "deterministic_validators",
        "reviewer_agent"
      ],
      "auto_fix_allowed_for": [
        "format_error",
        "template_gap",
        "known_fact_omission",
        "terminology_inconsistency",
        "document_routing_error",
        "confirmed_solution_clarity"
      ],
      "auto_fix_forbidden_for": [
        "business_direction_change",
        "core_interface_add_or_remove",
        "risk_strategy_change",
        "system_boundary_change",
        "human_approval_replacement"
      ],
      "unresolved_blocker_status": "blocked_or_waiting_for_human_review"
    },
    "knowledge_mining_policy": {
      "candidate_outputs": [
        "rule-candidates.json",
        "prompt-optimization-candidates.md",
        "tl-review-package.json"
      ],
      "candidate_types": [
        "team-rule-candidate",
        "document-template-candidate",
        "agent-behavior-candidate"
      ],
      "required_fields": [
        "candidate_id",
        "source_run_id",
        "original_user_change",
        "agent_original_design",
        "human_review_feedback",
        "generalized_rule",
        "scope",
        "non_scope",
        "counter_examples",
        "contains_specific_business_fact",
        "generalization_level",
        "suggested_landing_zone",
        "tl_review_status"
      ],
      "auto_apply_to_plugin": false,
      "tl_review_required": true
    }
  },
  "engineering_governance_state_machine": {
    "model_name": "engineering-governance-v2",
    "positioning": "engineering-assistant 保留软件工程方法论主控权；Codex、Hermes、skills 和 MCP 是可委派执行能力，不替代工程状态、边界、门禁和验收责任。",
    "default_stage_model": [
      "intake",
      "context_modeling",
      "architecture_boundary",
      "implementation_contract",
      "controlled_execution",
      "quality_verification",
      "review_and_release",
      "retrospective_learning"
    ],
    "stage_contracts": {
      "intake": [
        "requirement_contract",
        "scope_and_non_goals",
        "acceptance_criteria",
        "blocking_questions"
      ],
      "context_modeling": [
        "repo_context",
        "module_map",
        "reusable_capabilities",
        "impact_scope"
      ],
      "architecture_boundary": [
        "system_boundary",
        "data_flow",
        "interface_contract",
        "risk_decisions"
      ],
      "implementation_contract": [
        "allowed_modules",
        "forbidden_modules",
        "quality_commands",
        "traceability_matrix"
      ],
      "controlled_execution": [
        "changed_files",
        "delegated_capability_ledger",
        "repair_attempts",
        "control_health"
      ],
      "quality_verification": [
        "test_evidence",
        "build_evidence",
        "browser_or_runtime_evidence",
        "gate_decision"
      ],
      "review_and_release": [
        "findings",
        "approval_requests",
        "release_readiness",
        "rollback_plan"
      ],
      "retrospective_learning": [
        "lessons",
        "rule_candidates",
        "skill_improvement_candidates"
      ]
    },
    "required_control_surface": [
      "current-task.json",
      "current-subtask.json",
      "artifact-index.json",
      "open-questions.json",
      "quality-contract.json",
      "quality-run-report.json",
      "implementation-contract.json",
      "traceability-matrix.json",
      "capability-invocation-ledger.json",
      "control-health-report.json"
    ],
    "hard_rules": [
      "设计阶段可以裁剪，但不得跳过需求边界、影响范围、质量命令和阻断问题判断。",
      "长期任务恢复必须先读取目标项目 artifacts/_control/ 机读控制面，不得用聊天记忆或历史长文档替代。",
      "委派工具完成执行后，engineering-assistant 必须消费其证据并作 gate decision；子工具自述成功不是通过证据。",
      "缺少关键能力时必须按能力协议降级或阻断，不得伪造浏览器、代码图谱、CI、GitHub 或生产状态。"
    ]
  },
  "capability_routing_protocol": {
    "principle": "先用软件工程状态机确定阶段、边界和验收，再选择最合适执行能力；委派不转移工程责任。",
    "decision_values": [
      "use_native_codex",
      "delegate",
      "fallback",
      "block",
      "skip"
    ],
    "capabilities": {
      "codebase_analysis": {
        "preferred": [
          "codegraph"
        ],
        "fallback": [
          "rg",
          "targeted_file_reads",
          "compiler_or_test_feedback"
        ],
        "missing_behavior": "continue_with_lower_confidence",
        "required_evidence": [
          "queried_symbols_or_files",
          "impact_scope",
          "confidence_note"
        ]
      },
      "frontend_product_execution": {
        "preferred": [
          "build-web-apps",
          "browser"
        ],
        "fallback": [
          "repo_native_frontend_stack",
          "playwright_or_local_render_check"
        ],
        "missing_behavior": "block_browser_level_acceptance",
        "required_evidence": [
          "product_ia",
          "state_coverage",
          "desktop_mobile_render_evidence"
        ]
      },
      "github_pr_ci": {
        "preferred": [
          "github"
        ],
        "fallback": [
          "local_git_diff",
          "local_quality_commands"
        ],
        "missing_behavior": "do_not_claim_remote_pr_or_ci_state",
        "required_evidence": [
          "local_diff",
          "commands_run",
          "remote_state_if_available"
        ]
      },
      "security_or_production": {
        "preferred": [
          "security_tools",
          "human_approval"
        ],
        "fallback": [],
        "missing_behavior": "block_until_review",
        "required_evidence": [
          "approval_record",
          "risk_assessment",
          "rollback_or_mitigation"
        ]
      }
    },
    "ledger_artifact": "artifacts/_control/capability-invocation-ledger.json",
    "health_artifact": "artifacts/_control/capability-health.json",
    "block_markers": [
      "CAPABILITY_REQUIRED_BUT_UNAVAILABLE",
      "DELEGATED_OUTPUT_UNVERIFIED",
      "REMOTE_STATE_UNPROVEN"
    ]
  },
  "documentation_output_mode_policy": {
    "default_mode": "control_surface_first",
    "formal_document_mode": "on_human_review_or_audit_need",
    "required_by_default": [
      "machine_readable_contracts",
      "open_questions",
      "quality_commands",
      "traceability",
      "gate_decision",
      "capability_ledger"
    ],
    "optional_by_default": [
      "long_markdown_design",
      "stage_summary",
      "human_readable_html",
      "workflow_summary",
      "handoff_narrative"
    ],
    "promotion_rule": "长文档只有在人类评审、交接、审计、合规或用户明确要求时生成或提升到 docs/；否则保持为 .run-artifacts 或 artifacts/_control 的机读事实。",
    "control_preservation_rule": "减少长文档不能减少控制能力；任何裁剪必须保留当前任务、范围、阻断问题、质量命令、变更追踪和验收证据。"
  },
  "quality_contract_runner_policy": {
    "runner": "engineering-assistant/scripts/run_quality_contract.py",
    "compatibility_runner": "engineering-assistant/scripts/run_quality_commands.py",
    "input": "artifacts/_control/quality-contract.json",
    "output": "artifacts/_control/quality-run-report.json",
    "required_command_rule": "required_commands 中 required=true 的命令失败时必须阻断，即使 make validate 或其他总体验证命令通过。",
    "report_fields": [
      "command",
      "cwd",
      "exit_code",
      "duration_ms",
      "stdout_excerpt",
      "stderr_excerpt",
      "required",
      "blocking"
    ],
    "sync_targets": [
      "current-task.json.active_slice",
      "current-subtask.json",
      "open-questions.json",
      "artifact-index.json"
    ],
    "blocker_id_prefix": "QR-BLOCKER"
  },
  "document_spine_policy": {
    "spine_artifact": "docs/00-index/product-planning-spine.md",
    "machine_index": "docs/00-index/document-index.json",
    "active_document_budget": 12,
    "active_context_rule": "每个任务只读取 product-planning-spine、当前任务直接关联文档、任务规则包和明确引用的 source_artifacts；不得因 docs 增长而全量扫读。",
    "document_growth_controls": [
      "新增 docs 文档必须登记到 document-index.json，声明 owner、status、retention_policy、supersedes/superseded_by 和 agent_read_policy",
      "被替代的规划/设计文档必须标记 superseded 或 archived，不能和新文档同时作为 active source",
      "过程资料先进入 .run-artifacts；确认交付后提升到 docs 并同步更新 planning spine 与 document-index",
      "任务结束必须输出 retained-vs-transient 清单，说明保留、归档、丢弃和后续规划影响"
    ],
    "drift_markers": [
      "DOC_SPRAWL_RISK",
      "ACTIVE_CONTEXT_OVER_BUDGET",
      "STALE_PLAN_SOURCE",
      "UNINDEXED_FORMAL_DOC"
    ]
  },
  "agent_execution_monitor_policy": {
    "monitor_artifact": ".run-artifacts/engineering-assistant/<run_id>/agent-execution-monitor.json",
    "required_for": [
      "parallelization",
      "subagent_execution",
      "delegated_review",
      "long_running_task"
    ],
    "required_agent_fields": [
      "agent_id",
      "role",
      "assigned_scope",
      "forbidden_scope",
      "expected_outputs",
      "required_checks",
      "status"
    ],
    "strict_check_rule": "子 agent 自述不能作为通过证据；必须由 orchestrator 或独立 checker 读取产物、命令输出、diff、测试或验证报告后登记 observed_evidence。",
    "monitor_checks": [
      "scope_adherence",
      "evidence_returned",
      "independent_verification",
      "blocked_or_failed_reported",
      "artifact_consumed_by_orchestrator",
      "no_unverified_success_claim"
    ],
    "failure_markers": [
      "SUBAGENT_UNVERIFIED_SUCCESS",
      "SUBAGENT_SCOPE_DRIFT",
      "SUBAGENT_EVIDENCE_MISSING",
      "MONITOR_CHECK_NOT_CONSUMED"
    ]
  },
  "product_plan_alignment_policy": {
    "plan_spine_artifact": "docs/00-index/product-planning-spine.md",
    "alignment_artifact": ".run-artifacts/engineering-assistant/<run_id>/post-task-plan-alignment.json",
    "required_before_task_close": true,
    "required_fields": [
      "product_goal",
      "capability_path",
      "accepted_scope",
      "out_of_scope",
      "integration_points",
      "next_plan_update",
      "alignment_status"
    ],
    "alignment_statuses": [
      "aligned",
      "aligned_with_followups",
      "drift_detected",
      "blocked"
    ],
    "close_blockers": [
      "任务完成但未映射到产品能力路径",
      "实现只在当前局部可用但破坏整体规划/边界/演进路径",
      "发现规划漂移但未更新 planning spine 或后续任务",
      "新增正式 docs 未登记 document-index 或未处理 superseded 文档"
    ],
    "drift_markers": [
      "PRODUCT_PLAN_DRIFT",
      "LOCAL_OPTIMUM_ONLY",
      "MISSING_POST_TASK_ALIGNMENT",
      "PLAN_SPINE_NOT_UPDATED"
    ]
  },
  "language_policy": {
    "supported": [
      "zh-CN",
      "en"
    ],
    "when_unspecified": "ask_user",
    "blocking_status": "waiting_for_input",
    "question": "请确认输出语言：简体中文还是 English？",
    "writeback": "StageRunRequest.context.language"
  },
  "technology_selection_policy": {
    "categories": [
      "backend_framework",
      "persistence_framework",
      "frontend_stack",
      "component_library",
      "middleware",
      "test_framework",
      "build_tool",
      "observability",
      "deployment"
    ],
    "must_confirm_when": [
      "设计未声明技术选型",
      "repo_context 未识别现有技术栈",
      "生成代码需要选择后端/持久化/前端/组件库/测试/构建框架",
      "拟使用与现有项目不一致的技术"
    ],
    "ask_user_when_unspecified": true,
    "team_defaults": {
      "java_spring_persistence": "mybatis-plus"
    },
    "requires_review": [
