display_name: "Self Test"
short_description: "生成并执行自测方案，输出失败原因、影响范围和阻断判断。"
default_prompt: "使用 self-test，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "高风险测试豁免"
    - "无法执行关键测试"
    - "发布前置测试缺失"
metadata:
  owner: "测试负责人"
  stage: "self_test"
  type: "stage_skill"
  trigger_description: "Use when 生成并执行自测方案，输出失败原因、影响范围和阻断判断；Do not use when do not 伪造测试结果。"
routing:
  intent_tags:
    - "self"
    - "self-test"
    - "self_test"
    - "stage_skill"
    - "test"
    - "影响范围和阻断判断。"
    - "生成并执行自测方案"
    - "输出失败原因"
  allow_implicit_invocation: true
  cost_class: "medium"
