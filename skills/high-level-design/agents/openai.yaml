display_name: "High Level Design"
short_description: "从需求契约生成概要设计，明确架构边界、数据流、异常流和发布影响。"
default_prompt: "使用 high-level-design，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后先读取对应 assets template 并按模板骨架逐节填充输入事实。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "高风险架构决策"
    - "跨域边界调整"
    - "核心链路兼容性变化"
metadata:
  owner: "架构师"
  stage: "high_level_design"
  type: "stage_skill"
  trigger_description: "Use when 从需求契约生成概要设计，明确架构边界、数据流、异常流和发布影响；Do not use when do not 深入代码实现细节。"
routing:
  intent_tags:
    - "design"
    - "high"
    - "high-level-design"
    - "high_level_design"
    - "level"
    - "stage_skill"
    - "从需求契约生成概要设计"
    - "异常流和发布影响。"
    - "数据流"
    - "明确架构边界"
  allow_implicit_invocation: true
  cost_class: "medium"
