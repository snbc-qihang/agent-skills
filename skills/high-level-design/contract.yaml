{
  "skill_id": "high-level-design",
  "skill_name": "High Level Design",
  "version": "1.0.0",
  "stage": "high_level_design",
  "type": "stage_skill",
  "purpose": "从需求契约生成概要设计，明确架构边界、数据流、异常流和发布影响。",
  "non_goals": [
    "不深入代码实现细节",
    "不跳过架构风险",
    "不替代设计评审审批"
  ],
  "trigger_description": "Use when the request is about 从需求契约生成概要设计，明确架构边界、数据流、异常流和发布影响。；Do not use when 不深入代码实现细节；不跳过架构风险。",
  "routing": {
    "intent_tags": [
      "design",
      "high",
      "high-level-design",
      "high_level_design",
      "level",
      "stage_skill",
      "从需求契约生成概要设计",
      "异常流和发布影响。",
      "数据流",
      "明确架构边界"
    ],
    "positive_triggers": [
      "high-level-design",
      "High Level Design",
      "从需求契约生成概要设计，明确架构边界、数据流、异常流和发布影响。"
    ],
    "negative_triggers": [
      "只解释 High Level Design 的用途，不执行任务",
      "只咨询说明",
      "不生成产物"
    ],
    "requires": [
      "requirement-contract.json",
      "team_standards",
      "repo_context",
      "risk_policy"
