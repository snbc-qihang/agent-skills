    "cost_class": "medium",
    "evidence_required": [
      "需求契约已准入",
      "模块边界明确",
      "核心数据流完整",
      "架构风险有缓解方案"
    ],
    "allow_implicit_invocation": true
  },
  "standalone_mode": "读取输入、校验前置条件、在指定输出目录生成全部声明产物，并在阻断门禁处停止。",
  "workflow_mode": "消费 StageRunRequest 中的上游产物，输出 StageRunResult，并把声明产物路由给下游 workflow 节点。",
  "language_policy": {
    "supported": [
      "zh-CN",
      "en"
    ],
    "when_unspecified": "ask_user",
    "blocking_status": "waiting_for_input",
    "question": "请确认输出语言：简体中文还是 English？",
    "writeback": "StageRunRequest.context.language"
  },
  "technology_selection_policy": {
    "categories": [
      "backend_framework",
      "persistence_framework",
      "frontend_stack",
      "component_library",
      "middleware",
      "test_framework",
      "build_tool",
      "observability",
      "deployment"
    ],
    "must_confirm_when": [
      "设计未声明技术选型",
      "repo_context 未识别现有技术栈",
      "生成代码需要选择后端/持久化/前端/组件库/测试/构建框架",
      "拟使用与现有项目不一致的技术"
    ],
    "ask_user_when_unspecified": true,
    "team_defaults": {
      "java_spring_persistence": "mybatis-plus"
    },
    "requires_review": [
      "JDBC",
      "框架替换",
      "绕过现有 mapper/repository 模式",
      "前端技术栈或组件库变更",
      "测试框架替换",
      "构建工具替换",
      "中间件替换"
    ],
    "writeback": "StageRunRequest.context.technology_selection"
  },
  "team_adaptation_policy": {
    "profile_id": "rrq-yq-team",
    "profile_path": "engineering-assistant/profiles/rrq-yq-team.yaml",
    "source_catalog": "engineering-assistant/registry/team-standard-sources.yaml",
    "rule_prefixes": [
      "RRQ",
      "YAPI",
      "YQ"
    ],
    "must_load_before_work": [
      "team-rule-catalog.yaml",
      "team-standard-sources.yaml",
      "rrq-yq-team.yaml"
    ],
    "fallback": "如果目标项目 profile 与团队默认 profile 冲突，优先使用目标项目 profile，并把冲突作为 finding 或 required_information_requests 输出。"
  },
  "inputs": [
    {
      "name": "requirement-contract.json",
      "type": "artifact|string|object",
      "required": true,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    },
    {
      "name": "team_standards",
      "type": "artifact|string|object",
      "required": false,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    },
    {
      "name": "repo_context",
      "type": "artifact|string|object",
      "required": false,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    },
    {
      "name": "risk_policy",
      "type": "artifact|string|object",
      "required": false,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    }
  ],
  "outputs": [
    {
      "name": "high-level-design.md",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/high-level-design/high-level-design.md",
      "schema": "output.schema.json#high-level-design.md",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    },
    {
      "name": "architecture-decision-record.md",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/high-level-design/architecture-decision-record.md",
      "schema": "output.schema.json#architecture-decision-record.md",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    },
    {
      "name": "module-boundary.yaml",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/high-level-design/module-boundary.yaml",
      "schema": "output.schema.json#module-boundary.yaml",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    },
    {
      "name": "risk-list.json",
      "type": "markdown|json|yaml|code|log|report",
      "path": "artifacts/high-level-design/risk-list.json",
      "schema": "output.schema.json#risk-list.json",
      "consumer": "workflow-orchestrator|downstream-stage|human-review"
    }
  ],
  "preconditions": [
    "必填输入已提供或已记录缺失处理策略",
    "风险策略已加载",
    "目标范围已明确"
  ],
  "execution_gates": {
    "language_confirmed": true,
    "preflight_required_information": true,
    "formal_document_metadata_required": true,
    "stage_result_validation_required": true,
    "block_when_agent_violates_contract": true
  },
  "required_information_policy": {
    "must_ask_when": [
      "必填输入缺失",
      "系统边界无法确认",
      "风险等级无法判断",
      "审批状态缺失",
      "无法基于仓库或上游产物可靠推导"
    ],
    "question_output": "required_information_requests",
    "blocking_status": "waiting_for_input",
    "human_review_html_required": true,
    "human_review_html_requirements": [
      "可填写每个待确认项",
      "保留问题 id 或稳定序号",
      "可复制或下载答案 JSON",
      "登记到 StageRunResult.artifacts",
      "HTML 路径必须位于目标项目 docs/human-review/",
      "agent 只消费 MD/JSON/YAML，不把 HTML 作为事实输入源"
    ],
    "minimum_question_fields": [
      "id",
      "question",
      "reason",
      "required",
      "priority",
      "expected_format"
    ],
    "question_order": [
      "critical",
      "major",
      "minor"
    ],
    "do_not_ask_when": "信息可从当前仓库、上游产物、明确 profile 或已确认上下文可靠获得时，不重复询问用户。"
  },
  "postconditions": [
    "全部输出产物已生成，或已输出明确的阻断结果",
    "质量门禁已评估",
    "需要人工审批的事项已列出"
  ],
  "dependencies": [
    "团队规范",
    "文档模板",
    "仓库上下文",
    "风险策略",
    "校验脚本"
  ],
  "permissions": {
    "allowed_actions": [
      "读取仓库文件",
      "生成产物",
      "运行确定性校验",
      "请求人工审批"
    ],
    "forbidden_actions": [
      "执行生产变更",
      "自动批准高风险动作",
      "隐藏失败检查",
      "覆盖无关工作"
    ]
  },
  "human_approval_required": [
    "高风险架构决策",
    "跨域边界调整",
    "核心链路兼容性变化"
  ],
  "risk_model": {
    "levels": [
      "low",
      "medium",
      "high",
      "critical"
    ],
    "upgrade_conditions": [
      "高风险架构决策",
      "跨域边界调整",
      "核心链路兼容性变化"
    ],
    "default_for_unknown": "medium"
  },
  "quality_gates": [
    {
      "gate_id": "high-level-design-gate-1",
      "name": "需求契约已准入",
      "type": "deterministic",
      "pass_condition": "需求契约已准入 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "high-level-design-gate-2",
      "name": "模块边界明确",
      "type": "deterministic",
      "pass_condition": "模块边界明确 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "high-level-design-gate-3",
      "name": "核心数据流完整",
      "type": "deterministic",
      "pass_condition": "核心数据流完整 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "high-level-design-gate-4",
      "name": "架构风险有缓解方案",
      "type": "deterministic",
      "pass_condition": "架构风险有缓解方案 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    }
  ],
  "failure_modes": [
    {
      "error_code": "MISSING_REQUIRED_INPUT",
      "condition": "必填输入不可用",
      "severity": "major",
      "recovery_strategy": "输出缺失信息产物并等待补充输入",
      "next_state": "waiting_for_input"
    },
    {
      "error_code": "INVALID_OUTPUT_SCHEMA",
      "condition": "输出无法按声明 schema 解析",
      "severity": "blocker",
      "recovery_strategy": "重新生成产物并再次运行校验器",
      "next_state": "failed"
    },
    {
      "error_code": "STAGE_RESULT_CONTRACT_VIOLATION",
      "condition": "StageRunResult 缺少语言、文档编号、主动问询或其他运行时门禁字段",
      "severity": "blocker",
      "recovery_strategy": "运行 validate_stage_run_result.py 并阻断违规节点",
      "next_state": "blocked"
    },
    {
      "error_code": "QUALITY_GATE_FAILED",
      "condition": "阻断门禁失败",
      "severity": "blocker",
      "recovery_strategy": "输出 findings 和 required actions",
      "next_state": "blocked"
    },
    {
      "error_code": "HUMAN_APPROVAL_REQUIRED",
      "condition": "风险策略要求人工审批",
      "severity": "major",
      "recovery_strategy": "创建 ApprovalRequest",
      "next_state": "waiting_for_human_review"
    }
  ],
  "eval_cases": [
    "happy_path",
    "missing_required_input",
    "ambiguous_input",
    "policy_conflict",
    "edge_case",
    "regression_case",
    "technology_demo_adoption",
    "control_plane_drift",
    "rule_consumption_gap",
    "context_noise_overload",
    "low_quality_automation"
  ],
  "workflow_interface": {
    "node_id": "high-level-design",
    "input_artifacts": [
      "requirement-contract.json",
      "team_standards",
      "repo_context",
      "risk_policy"
    ],
    "output_artifacts": [
      "high-level-design.md",
      "architecture-decision-record.md",
      "module-boundary.yaml",
      "risk-list.json"
    ],
    "document_metadata": {
      "schema": "engineering-assistant/schemas/document-lifecycle.schema.json",
      "required_when": "status=succeeded and markdown artifact exists"
    },
    "required_information_requests": {
      "artifact": "artifacts/high-level-design/required-information-request.json",
      "schema": "engineering-assistant/schemas/required-information-request.schema.json",
      "status_when_blocking": "waiting_for_input"
    },
    "state_transitions": [
      "pending",
      "running",
      "waiting_for_input",
      "waiting_for_human_review",
      "succeeded",
      "failed",
      "skipped",
      "blocked",
      "cancelled"
    ],
    "gate_decision": [
      "continue",
      "pause",
      "retry",
      "skip",
      "block",
      "stop"
    ],
    "retry_policy": {
      "max_attempts": 1,
      "retry_on": [
        "TOOL_UNAVAILABLE",
        "UNKNOWN_ERROR"
      ]
    }
  },
  "owner": "架构师",
  "reviewers": [
    "研发负责人",
    "架构师",
    "测试负责人"
  ],
  "change_policy": "contract、gate、schema 或审批规则变更必须经过 skill owner 评审，并通过 skill-quality-auditor",
  "team_document_policy": {
    "artifact": "high-level-design.md",
    "canonical_template": "skills/high-level-design/assets/high-level-design-template.md",
    "source_template": "inputs/萤启运营系统概要设计 - 萤启服务商系统 - 站点标题.html",
    "template_usage_policy": {
      "required": true,
      "source_of_truth": "template_assets[].canonical_template",
      "must_read_template_before_generation": true,
      "template_assets": [
        {
          "artifact": "high-level-design.md",
          "template": "assets/high-level-design-template.md",
          "canonical_template": "skills/high-level-design/assets/high-level-design-template.md",
          "source_template": "inputs/萤启运营系统概要设计 - 萤启服务商系统 - 站点标题.html",
          "selection": "概要设计正文"
        }
      ],
      "generation_protocol": [
        "生成正式 Markdown 文档前必须先读取对应 skill 的 assets template 文件，不得凭记忆、通用模板或聊天上下文替代。",
        "以 template 原文作为唯一正文骨架，保留 frontmatter、标题层级、章节顺序、表格列头、固定提示块和格式约定。",
        "只允许替换占位符、补充空白单元格和在既有章节下填充输入事实；不得删除、压缩、合并、重命名或重排模板章节。",
        "输入材料缺少事实时，保留模板章节并写明不适用原因，或进入 waiting_for_input 并输出 required_information_requests。",
        "不得用 assets/artifact-template.md 的证据/Findings/门禁决策骨架替代正式设计正文。",
        "模板文件不存在、无法读取或输出无法通过模板校验时，StageRunResult.status 必须为 blocked 或 failed。"
      ],
      "strict_format_rules": [
        "保留模板原有章节、标题名称、标题层级、表格列头和固定提示块。",
        "不适用章节不得删除，必须写明不适用原因或等待用户补充事实。",
        "不得把团队 template 压缩成摘要、检查清单或通用证据报告。",
        "不得把 source_template 只当参考风格；canonical_template 才是输出正文骨架。"
      ],
      "blocked_when": [
        "未读取 template asset 就生成正式 Markdown 文档",
        "输出缺少 template 章节、列头、固定提示块或顺序",
        "用 assets/artifact-template.md 或通用报告格式替代正式设计正文",
        "缺少关键事实却填充待确认占位符并标记 succeeded"
      ]
    },
    "required_sections": [
      "0. 原始需求与原型追溯",
      "1. 版本变更记录",
      "2. 平台概述",
      "3. 系统设计",
      "3.1 系统逻辑视图",
      "3.1.1 系统设计原则",
      "3.3 研发视图",
      "3.4 研发结构定义",
      "4. 核心功能",
      "4.1.3 跨服务服务间时序图",
      "5.中间件设计",
      "6.数据视图"
    ],
    "forbidden_headings": [
      "证据",
      "Findings",
      "必须补充信息",
      "门禁决策"
    ],
    "source_traceability_header": "| source_id | source_type | source_path_or_url | prototype_page_or_section | requirement_item | design_section | consistency_status |",
    "service_sequence_policy": {
      "required_mermaid": "sequenceDiagram",
      "participants_only": "services",
      "forbidden_participants": [
        "用户",
        "页面",
        "前端",
        "客户端",
        "Controller",
        "API",
        "接口",
        "数据库",
        "DB",
        "Redis",
        "MQ",
        "Topic",
        "Queue",
        "表",
        "Mapper",
        "Repository"
      ]
    },
    "rules": [
      "概要设计必须保留团队模板章节顺序",
      "系统设计必须明确逻辑视图、设计原则、研发视图和研发结构",
      "跨服务核心场景必须补充服务间 sequenceDiagram，参与者只允许服务",
      "中间件设计只说明是否涉及并引用专项设计",
      "数据视图声明事实表、读模型和专项 DB 设计关系",
      "概要设计必须保留原始需求规格或原型引用矩阵"
    ],
    "blocked_when": [
      "high-level-design.md 缺少团队模板章节",
      "使用通用证据/Findings/门禁决策模板替代概要设计正文",
      "跨系统边界、事件协作、最终一致性或异常流缺失",
      "缺少跨服务服务间时序图",
      "sequenceDiagram 参与者包含用户、页面、Controller、数据库、中间件或表对象",
      "缺少原始需求规格或原型引用矩阵"
    ]
  }
}
