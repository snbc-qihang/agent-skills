display_name: "Implementation Controller"
short_description: "把已审批设计转换为机器可读实现合同和质量合同，并控制代码实现、验证、修复和最终人工审阅。"
default_prompt: "使用 implementation-controller，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: false
  risk_level: "high"
  human_approval_required:
    - "修改已审批设计范围"
    - "高风险实现豁免"
    - "生产动作"
    - "修复轮次耗尽后的人工决策"
metadata:
  owner: "研发负责人"
  stage: "implementation_control"
  type: "control_skill"
  trigger_description: "Use when 把已审批设计转换为机器可读实现合同和质量合同，并控制代码实现、验证、修复和最终人工审阅；Do not use when do not 审批设计进入研发。"
routing:
  intent_tags:
    - "control_skill"
    - "controller"
    - "implementation"
    - "implementation-controller"
    - "implementation_control"
    - "修复和最终人工审阅。"
    - "并控制代码实现"
    - "把已审批设计转换为机器可读实现合同和质量合同"
    - "验证"
  allow_implicit_invocation: false
  cost_class: "high"
