      "读取仓库文件",
      "生成产物",
      "运行确定性校验",
      "请求人工审批"
    ],
    "forbidden_actions": [
      "执行生产变更",
      "自动批准高风险动作",
      "隐藏失败检查",
      "覆盖无关工作"
    ]
  },
  "human_approval_required": [
    "Redis key 批量删除",
    "核心链路缓存策略变化",
    "Redis 新 Key",
    "版本/拓扑/持久化/淘汰策略无法确认"
  ],
  "risk_model": {
    "levels": [
      "low",
      "medium",
      "high",
      "critical"
    ],
    "upgrade_conditions": [
      "Redis key 批量删除",
      "核心链路缓存策略变化",
      "Redis 新 Key",
      "版本/拓扑/持久化/淘汰策略无法确认"
    ],
    "default_for_unknown": "medium"
  },
  "quality_gates": [
    {
      "gate_id": "redis-design-gate-1",
      "name": "redis-design.md 使用团队 Redis 模板",
      "type": "deterministic",
      "pass_condition": "redis-design.md 使用团队 Redis 模板 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "redis-design-gate-2",
      "name": "key 命名合规",
      "type": "deterministic",
      "pass_condition": "key 命名合规 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "redis-design-gate-3",
      "name": "所有 Key 设置 TTL 且单位明确",
      "type": "deterministic",
      "pass_condition": "所有 Key 设置 TTL 且单位明确 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "redis-design-gate-4",
      "name": "一致性策略可验证",
      "type": "deterministic",
      "pass_condition": "一致性策略可验证 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "redis-design-gate-5",
      "name": "穿透/击穿/雪崩有策略",
      "type": "deterministic",
      "pass_condition": "穿透/击穿/雪崩有策略 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    },
    {
      "gate_id": "redis-design-gate-6",
      "name": "不可用降级策略明确",
      "type": "deterministic",
      "pass_condition": "不可用降级策略明确 有证据证明已满足",
      "fail_action": "block 或 require_human_review"
    }
  ],
  "failure_modes": [
    {
      "error_code": "MISSING_REQUIRED_INPUT",
      "condition": "必填输入不可用",
      "severity": "major",
      "recovery_strategy": "输出缺失信息产物并等待补充输入",
      "next_state": "waiting_for_input"
    },
    {
      "error_code": "INVALID_OUTPUT_SCHEMA",
      "condition": "输出无法按声明 schema 解析",
      "severity": "blocker",
      "recovery_strategy": "重新生成产物并再次运行校验器",
      "next_state": "failed"
    },
    {
      "error_code": "STAGE_RESULT_CONTRACT_VIOLATION",
      "condition": "StageRunResult 缺少语言、文档编号、主动问询或其他运行时门禁字段",
      "severity": "blocker",
      "recovery_strategy": "运行 validate_stage_run_result.py 并阻断违规节点",
      "next_state": "blocked"
    },
    {
      "error_code": "QUALITY_GATE_FAILED",
      "condition": "阻断门禁失败",
      "severity": "blocker",
      "recovery_strategy": "输出 findings 和 required actions",
      "next_state": "blocked"
    },
    {
      "error_code": "HUMAN_APPROVAL_REQUIRED",
      "condition": "风险策略要求人工审批",
      "severity": "major",
      "recovery_strategy": "创建 ApprovalRequest",
      "next_state": "waiting_for_human_review"
    }
  ],
  "eval_cases": [
    "happy_path",
    "missing_required_input",
    "ambiguous_input",
    "policy_conflict",
    "edge_case",
    "regression_case",
    "technology_demo_adoption",
    "control_plane_drift",
    "rule_consumption_gap",
