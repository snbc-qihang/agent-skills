{
  "skill_id": "code-quality-governor",
  "skill_name": "Code Quality Governor",
  "version": "1.0.0",
  "stage": "code_quality",
  "type": "cross_cutting_skill",
  "purpose": "建立 Q0-Q4 多层代码质量门禁，输出可被 CI/CD、PR、workflow 消费的结构化质量报告。",
  "non_goals": [
    "不以 LLM 判断替代 build/test/lint",
    "不在测试失败时输出 pass",
    "不降级 blocker"
  ],
  "trigger_description": "Use when the request is about 建立 Q0-Q4 多层代码质量门禁，输出可被 CI/CD、PR、workflow 消费的结构化质量报告。；Do not use when 不以 LLM 判断替代 build/test/lint；不在测试失败时输出 pass。",
  "routing": {
    "intent_tags": [
      "CI/CD",
      "PR",
      "Q0-Q4",
      "code",
      "code-quality-governor",
      "code_quality",
      "cross_cutting_skill",
      "governor",
      "quality",
      "workflow",
      "多层代码质量门禁",
      "建立"
    ],
    "positive_triggers": [
      "code-quality-governor",
      "Code Quality Governor",
      "建立 Q0-Q4 多层代码质量门禁，输出可被 CI/CD、PR、workflow 消费的结构化质量报告。"
    ],
    "negative_triggers": [
      "只解释 Code Quality Governor 的用途，不执行任务",
      "只咨询说明",
      "不生成产物"
    ],
    "requires": [
      "changed-files-report.json",
      "design-to-code-mapping.yaml",
      "self-test-report.md",
      "ci artifacts"
    ],
    "conflicts_with": [],
    "risk_level": "high",
    "cost_class": "high",
    "evidence_required": [
      "Q0 设计一致性",
      "Q1 确定性工程检查",
      "Q1.5 Sonar/Qodana/Checkstyle 静态分析",
      "Q2 语义代码评审",
      "Q3 风险专项门禁",
      "Q4 发布前回归门禁"
    ],
    "allow_implicit_invocation": false
  },
  "standalone_mode": "先执行 preflight 信息梳理；blocking 信息缺失时仅输出 required_information_requests、human-review HTML 和恢复点，补齐后再在指定输出目录生成全部声明产物。",
  "workflow_mode": "消费 StageRunRequest 中的上游产物，先执行 preflight 信息梳理；blocking 信息缺失时暂停并等待补充写回，补齐后输出 StageRunResult 并把声明产物路由给下游 workflow 节点。",
  "preflight_runtime_gate": {
    "state_field": "preflight_input_state",
    "states": [
      "ready",
      "waiting_for_input",
      "waiting_for_human_review",
      "blocked"
    ],
    "formal_generation_entry_condition": "preflight_input_state == ready",
    "formal_generation_blocked_when": [
      "preflight_input_state != ready",
      "存在 blocking required_information_requests",
      "human-review HTML 已生成但补充答案未写回机读事实源"
    ],
    "waiting_for_input_allowed_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "waiting_for_input_forbidden_formal_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "resume_after_writeback": "StageRunRequest.context、artifact index 或 MD/JSON/YAML 已记录用户补充答案、来源和时间。"
  },
  "design_governance_policy": {
    "states": [
      "intake_collecting",
      "intake_gap_analysis",
      "waiting_for_user_input",
      "direction_confirming",
      "design_generating",
      "self_reviewing",
      "design_revising",
      "waiting_for_human_review",
      "human_review_processing",
      "design_regenerating",
      "knowledge_mining",
      "tl_rule_candidate_pending",
      "approved_or_done"
    ],
    "formal_design_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "preflight_control_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "document_lifecycle_states": [
      "not_started",
      "draft",
      "ready_for_self_review",
      "self_review_failed",
      "revised",
      "waiting_for_human_review",
      "human_review_rejected",
      "approved",
      "final",
      "superseded",
      "archived",
      "blocked",
      "waiting_for_input"
    ],
    "hard_gates": {
      "information_complete_before_formal_generation": true,
      "direction_confirmed_before_design_generation": true,
      "specialty_scope_confirmed_before_specialty_docs": true,
      "self_review_passed_before_human_review": true,
      "human_review_approved_before_final": true,
      "approved_or_final_before_code_control_surface": true
    },
    "waiting_for_input_policy": {
      "allowed_artifacts": [
        "information-inventory.json",
        "context-source-map.json",
        "missing-information-list.json",
        "required-information-request.json",
        "design-objective-plan.md",
        "scope-and-non-goals.yaml",
        "user-confirmed-facts.json",
        "design-direction-decision.md",
        "docs/human-review/<run-id>.html",
        "workflow-trace.json",
        "resume-point.json"
      ],
      "forbidden_artifacts": [
        "high-level-design.md",
        "detailed-design.md",
        "database-design.md",
        "redis-design.md",
        "mq-design.xlsx",
        "interface-contracts.yaml",
        "test-strategy.md"
      ],
      "must_not_register_formal_artifacts_as_completed": true,
      "resume_requires_writeback_to_machine_readable_source": true
    },
    "review_feedback_policy": {
      "classification_required": true,
      "classes": [
        "fact_completion",
        "direction_change",
        "document_defect",
        "standard_violation",
        "team_rule_candidate"
      ],
      "default_update_strategy": "incremental_patch_affected_artifacts",
      "full_regeneration_allowed_when": [
        "architecture_direction_changed",
        "data_model_changed",
        "interface_boundary_changed",
        "message_model_changed"
      ],
      "full_regeneration_requires": [
        "impact_analysis",
        "supersede_previous_version",
        "workflow_trace_reason"
      ]
    },
    "self_review_policy": {
      "layers": [
        "deterministic_validators",
        "reviewer_agent"
      ],
      "auto_fix_allowed_for": [
        "format_error",
        "template_gap",
        "known_fact_omission",
        "terminology_inconsistency",
        "document_routing_error",
        "confirmed_solution_clarity"
      ],
      "auto_fix_forbidden_for": [
        "business_direction_change",
        "core_interface_add_or_remove",
        "risk_strategy_change",
        "system_boundary_change",
        "human_approval_replacement"
      ],
      "unresolved_blocker_status": "blocked_or_waiting_for_human_review"
    },
    "knowledge_mining_policy": {
      "candidate_outputs": [
        "rule-candidates.json",
        "prompt-optimization-candidates.md",
        "tl-review-package.json"
      ],
      "candidate_types": [
        "team-rule-candidate",
        "document-template-candidate",
        "agent-behavior-candidate"
      ],
      "required_fields": [
        "candidate_id",
        "source_run_id",
        "original_user_change",
        "agent_original_design",
        "human_review_feedback",
        "generalized_rule",
        "scope",
        "non_scope",
        "counter_examples",
        "contains_specific_business_fact",
        "generalization_level",
        "suggested_landing_zone",
        "tl_review_status"
      ],
      "auto_apply_to_plugin": false,
      "tl_review_required": true
    }
  },
  "language_policy": {
    "supported": [
      "zh-CN",
      "en"
    ],
    "when_unspecified": "ask_user",
    "blocking_status": "waiting_for_input",
    "question": "请确认输出语言：简体中文还是 English？",
    "writeback": "StageRunRequest.context.language"
  },
  "technology_selection_policy": {
    "categories": [
      "backend_framework",
      "persistence_framework",
      "frontend_stack",
      "component_library",
      "middleware",
      "test_framework",
      "build_tool",
      "observability",
      "deployment"
    ],
    "must_confirm_when": [
      "设计未声明技术选型",
      "repo_context 未识别现有技术栈",
      "生成代码需要选择后端/持久化/前端/组件库/测试/构建框架",
      "拟使用与现有项目不一致的技术"
    ],
    "ask_user_when_unspecified": true,
    "team_defaults": {
      "java_spring_persistence": "mybatis-plus"
    },
    "requires_review": [
      "JDBC",
      "框架替换",
      "绕过现有 mapper/repository 模式",
      "前端技术栈或组件库变更",
      "测试框架替换",
      "构建工具替换",
      "中间件替换"
    ],
    "writeback": "StageRunRequest.context.technology_selection"
  },
  "team_adaptation_policy": {
    "profile_id": "rrq-yq-team",
    "profile_path": "engineering-assistant/profiles/rrq-yq-team.yaml",
    "source_catalog": "engineering-assistant/registry/team-standard-sources.yaml",
    "rule_prefixes": [
      "RRQ",
      "YAPI",
      "YQ"
    ],
    "must_load_before_work": [
      "team-rule-catalog.yaml",
      "team-standard-sources.yaml",
      "rrq-yq-team.yaml"
    ],
    "fallback": "如果目标项目 profile 与团队默认 profile 冲突，优先使用目标项目 profile，并把冲突作为 finding 或 required_information_requests 输出。"
  },
  "inputs": [
    {
      "name": "changed-files-report.json",
      "type": "artifact|string|object",
      "required": true,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    },
    {
      "name": "design-to-code-mapping.yaml",
      "type": "artifact|string|object",
      "required": false,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    },
    {
      "name": "self-test-report.md",
      "type": "artifact|string|object",
      "required": false,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    },
    {
      "name": "ci artifacts",
      "type": "artifact|string|object",
      "required": false,
      "source": "user|workflow|repo|ci",
      "validation": "必填输入必须存在，选填输入必须可追溯来源",
      "missing_strategy": "除非无法定义边界，否则基于明确假设继续；无法定义边界时进入 waiting_for_input"
    }
  ],
