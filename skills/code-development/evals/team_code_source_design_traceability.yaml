      "DG20"
    ],
    "risk_focus": [
      "规格原型追溯",
      "设计到代码映射",
      "无依据代码",
      "验证证据"
    ],
    "forbidden_behavior": [
      "只写变更摘要不写 source_id",
      "代码文件无法映射设计章节",
      "traceability-matrix.json 缺少 code_path",
      "缺少验证证据"
    ]
  },
