display_name: "Design Review"
short_description: "评审设计产物，判断是否可以进入代码研发。"
default_prompt: "使用 design-review，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: true
  risk_level: "medium"
  human_approval_required:
    - "高风险设计放行"
    - "blocker 关闭确认"
    - "关键设计豁免"
metadata:
  owner: "架构师"
  stage: "design_review"
  type: "stage_skill"
  trigger_description: "Use when 评审设计产物，判断是否可以进入代码研发；Do not use when do not 代替审批人签字。"
routing:
  intent_tags:
    - "design"
    - "design-review"
    - "design_review"
    - "review"
    - "stage_skill"
    - "判断是否可以进入代码研发。"
    - "评审设计产物"
  allow_implicit_invocation: true
  cost_class: "medium"
