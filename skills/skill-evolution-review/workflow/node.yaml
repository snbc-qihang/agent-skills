{
  "node_id": "skill-evolution-review",
  "stage": "skill_evolution_review",
  "skill_id": "skill-evolution-review",
  "version": "3.1.0",
  "mode": "standalone|workflow",
  "entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "depends_on": [],
  "inputs": [
    "feedback-inbox.json",
    "feedback-event.json",
    "engineering-lessons.md",
    "skill registry"
  ],
  "outputs": [
    "skill-evolution-report.md",
    "skill-evolution-candidates.json",
    "skill-patch-proposals.json",
    "regression-case-candidates.yaml",
    "feedback-rejection-log.json"
  ],
  "preconditions": [
    "contract 输入可用",
    "风险策略已加载"
  ],
  "postconditions": [
    "StageRunResult 已输出",
    "产物已登记索引"
  ],
  "quality_gates": [
    "每个候选有来源事件",
    "accept/reject verdict 明确",
    "重复用户纠正已生成回归候选",
    "正式 skill 修改需要人工审批"
  ],
  "approval_policy": {
    "required_for": [
      "应用 skill patch",
      "新增强制 eval",
      "修改 workflow 或 quality gate",
      "发布插件版本"
    ],
    "decision": [
      "pending",
      "approved",
      "rejected"
    ]
  },
  "retry_policy": {
    "max_attempts": 1,
    "retry_on": [
      "TOOL_UNAVAILABLE",
      "UNKNOWN_ERROR"
    ]
  },
  "failure_policy": {
    "block_on": [
      "QUALITY_GATE_FAILED",
      "RISK_POLICY_VIOLATION",
      "STAGE_RESULT_CONTRACT_VIOLATION"
    ],
    "pause_on": [
      "HUMAN_APPROVAL_REQUIRED",
      "MISSING_REQUIRED_INPUT"
    ]
  },
  "next_nodes": [],
  "artifact_mapping": {
    "skill-evolution-report.md": "artifacts/skill-evolution-review/skill-evolution-report.md",
    "skill-evolution-candidates.json": "artifacts/skill-evolution-review/skill-evolution-candidates.json",
    "skill-patch-proposals.json": "artifacts/skill-evolution-review/skill-patch-proposals.json",
    "regression-case-candidates.yaml": "artifacts/skill-evolution-review/regression-case-candidates.yaml",
    "feedback-rejection-log.json": "artifacts/skill-evolution-review/feedback-rejection-log.json"
  }
}
