{
  "node_id": "prototype-review-loop",
  "stage": "prototype_review",
  "skill_id": "prototype-review-loop",
  "version": "3.1.0",
  "mode": "standalone|workflow",
  "entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "depends_on": [],
  "inputs": [
    "product-prototype-contract.json",
    "desktop-prototype-screenshot.png",
    "mobile-prototype-screenshot.png",
    "interaction-state-map.json"
  ],
  "outputs": [
    "prototype-review-report.json",
    "prototype-review-findings.md",
    "prototype-gate-decision.json"
  ],
  "preconditions": [
    "contract 输入可用",
    "风险策略已加载"
  ],
  "postconditions": [
    "StageRunResult 已输出",
    "产物已登记索引"
  ],
  "quality_gates": [
    "至少三轮 agent 评审完成",
    "所有 blocker 已关闭或进入人工审批",
    "企业级可用性评分达标",
    "后续设计输入已冻结"
  ],
  "approval_policy": {
    "required_for": [
      "少于三轮评审放行",
      "保留未关闭 blocker",
      "原型和实现不一致豁免"
    ],
    "decision": [
      "pending",
      "approved",
      "rejected"
    ]
  },
  "retry_policy": {
    "max_attempts": 1,
    "retry_on": [
      "TOOL_UNAVAILABLE",
      "UNKNOWN_ERROR"
    ]
  },
  "failure_policy": {
    "block_on": [
      "QUALITY_GATE_FAILED",
      "RISK_POLICY_VIOLATION",
      "STAGE_RESULT_CONTRACT_VIOLATION"
    ],
    "pause_on": [
      "HUMAN_APPROVAL_REQUIRED",
      "MISSING_REQUIRED_INPUT"
    ]
  },
  "next_nodes": [],
  "artifact_mapping": {
    "prototype-review-report.json": "artifacts/prototype-review-loop/prototype-review-report.json",
    "prototype-review-findings.md": "artifacts/prototype-review-loop/prototype-review-findings.md",
    "prototype-gate-decision.json": "artifacts/prototype-review-loop/prototype-gate-decision.json"
  }
}
