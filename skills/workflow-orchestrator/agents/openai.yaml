display_name: "Workflow Orchestrator"
short_description: "支持阶段选择、全链路 workflow、状态机、错误处理、审批暂停/恢复、产物传递和 trace 记录。"
default_prompt: "使用 workflow-orchestrator，先执行 preflight 信息梳理；preflight_input_state 不是 ready 时仅生成补充信息请求、human-review HTML 和恢复点，ready 后再进入 formal_generation 输出声明产物、findings、required actions 和 gate decision。"
language_policy:
  supported:
    - "zh-CN"
    - "en"
  when_unspecified: "ask_user"
  question: "请确认输出语言：简体中文还是 English？"
preflight_gate:
  state_field: "preflight_input_state"
  states:
    - "ready"
    - "waiting_for_input"
    - "waiting_for_human_review"
    - "blocked"
  formal_generation_entry_condition: "preflight_input_state == ready"
policy:
  allow_implicit_invocation: false
  risk_level: "high"
  human_approval_required:
    - "人工审批网关"
    - "跳过阻断节点"
    - "恢复 blocked workflow"
    - "高风险动作执行"
    - "设计方案方向确认"
    - "TL 规范候选入库"
metadata:
  owner: "workflow owner"
  stage: "workflow_orchestration"
  type: "workflow_skill"
  trigger_description: "Use when the request is about 支持阶段选择、全链路 workflow、状态机、错误处理、审批暂停/恢复、产物传递和 trace 记录。；Do not use when 不直接生成阶段文档；不绕过子 skill contract。"
routing:
  intent_tags:
    - "orchestrator"
    - "trace"
    - "workflow"
    - "workflow-orchestrator"
    - "workflow_orchestration"
    - "workflow_skill"
    - "产物传递和"
    - "全链路"
    - "审批暂停/恢复"
    - "支持阶段选择"
    - "状态机"
    - "记录。"
  allow_implicit_invocation: false
  cost_class: "high"
