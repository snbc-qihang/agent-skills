{
  "node_id": "workflow-orchestrator",
  "stage": "workflow_orchestration",
  "skill_id": "workflow-orchestrator",
  "version": "1.1.0",
  "mode": "standalone|workflow",
  "entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "depends_on": [],
  "inputs": [
    "workflow.yaml",
    "stage node registry",
    "StageRunRequest",
    "approval_context"
  ],
  "outputs": [
    "workflow-trace.json",
    "workflow-summary.md",
    "approval-requests.json",
    "artifact-index.json",
    "validator-summary.json",
    "information-inventory.json",
    "context-source-map.json",
    "missing-information-list.json",
    "design-objective-plan.md",
    "scope-and-non-goals.yaml",
    "user-confirmed-facts.json",
    "design-direction-decision.md",
    "assumption-and-decision-log.yaml",
    "self-review-findings.json",
    "auto-fix-report.json",
    "unresolved-review-findings.json",
    "human-review-package.json",
    "human-review-feedback.json",
    "feedback-classification.json",
    "next-iteration-plan.md",
    "iteration-trace.json",
    "rule-candidates.json",
    "prompt-optimization-candidates.md",
    "tl-review-package.json"
  ],
  "preconditions": [
    "contract 输入可用",
    "风险策略已加载",
    "preflight gate 已执行"
  ],
  "preflight_gate": {
    "state_field": "preflight_input_state",
    "states": [
      "ready",
      "waiting_for_input",
      "waiting_for_human_review",
      "blocked"
    ],
    "formal_generation_entry_condition": "preflight_input_state == ready",
    "block_formal_generation_when_not_ready": true,
    "block_next_nodes_when_not_ready": true
  },
  "postconditions": [
    "StageRunResult 已输出",
    "产物已登记索引"
  ],
  "quality_gates": [
    "节点 contract 匹配",
    "信息收集完成或已暂停追问",
    "方案方向已确认或已暂停确认",
    "前置条件满足",
    "产物 schema 合规",
    "专项 validator 结果全部通过或向上冒泡为 blocked",
    "自审 blocker 已修复或保留为 unresolved",
    "高风险动作进入审批",
    "TL 规范候选未自动入库"
  ],
  "approval_policy": {
    "required_for": [
      "人工审批网关",
      "跳过阻断节点",
      "恢复 blocked workflow",
      "高风险动作执行",
      "设计方案方向确认",
      "TL 规范候选入库"
    ],
    "decision": [
      "pending",
      "approved",
      "rejected"
    ]
  },
  "retry_policy": {
    "max_attempts": 1,
    "retry_on": [
      "TOOL_UNAVAILABLE",
      "UNKNOWN_ERROR"
    ]
  },
  "failure_policy": {
    "block_on": [
      "QUALITY_GATE_FAILED",
      "RISK_POLICY_VIOLATION",
      "STAGE_RESULT_CONTRACT_VIOLATION"
    ],
    "pause_on": [
      "HUMAN_APPROVAL_REQUIRED",
      "MISSING_REQUIRED_INPUT"
    ]
  },
  "next_nodes": [],
  "artifact_mapping": {
    "workflow-trace.json": "artifacts/workflow-orchestrator/workflow-trace.json",
    "workflow-summary.md": "artifacts/workflow-orchestrator/workflow-summary.md",
    "approval-requests.json": "artifacts/workflow-orchestrator/approval-requests.json",
    "artifact-index.json": "artifacts/workflow-orchestrator/artifact-index.json",
    "validator-summary.json": "artifacts/workflow-orchestrator/validator-summary.json",
    "information-inventory.json": "artifacts/workflow-orchestrator/information-inventory.json",
    "context-source-map.json": "artifacts/workflow-orchestrator/context-source-map.json",
    "missing-information-list.json": "artifacts/workflow-orchestrator/missing-information-list.json",
    "design-objective-plan.md": "artifacts/workflow-orchestrator/design-objective-plan.md",
    "scope-and-non-goals.yaml": "artifacts/workflow-orchestrator/scope-and-non-goals.yaml",
    "user-confirmed-facts.json": "artifacts/workflow-orchestrator/user-confirmed-facts.json",
    "design-direction-decision.md": "artifacts/workflow-orchestrator/design-direction-decision.md",
    "assumption-and-decision-log.yaml": "artifacts/workflow-orchestrator/assumption-and-decision-log.yaml",
    "self-review-findings.json": "artifacts/workflow-orchestrator/self-review-findings.json",
    "auto-fix-report.json": "artifacts/workflow-orchestrator/auto-fix-report.json",
    "unresolved-review-findings.json": "artifacts/workflow-orchestrator/unresolved-review-findings.json",
    "human-review-package.json": "artifacts/workflow-orchestrator/human-review-package.json",
    "human-review-feedback.json": "artifacts/workflow-orchestrator/human-review-feedback.json",
    "feedback-classification.json": "artifacts/workflow-orchestrator/feedback-classification.json",
    "next-iteration-plan.md": "artifacts/workflow-orchestrator/next-iteration-plan.md",
    "iteration-trace.json": "artifacts/workflow-orchestrator/iteration-trace.json",
    "rule-candidates.json": "artifacts/workflow-orchestrator/rule-candidates.json",
    "prompt-optimization-candidates.md": "artifacts/workflow-orchestrator/prompt-optimization-candidates.md",
    "tl-review-package.json": "artifacts/workflow-orchestrator/tl-review-package.json"
  }
}
