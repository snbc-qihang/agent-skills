        "contract 输入可用",
        "风险策略已加载",
        "preflight gate 已执行"
      ],
      "preflight_gate": {
        "state_field": "preflight_input_state",
        "states": [
          "ready",
          "waiting_for_input",
          "waiting_for_human_review",
