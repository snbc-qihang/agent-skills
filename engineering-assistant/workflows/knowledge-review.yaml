{
  "workflow_id": "knowledge-review",
  "version": "1.1.0.0",
  "states": [
    "pending",
    "running",
    "waiting_for_input",
    "waiting_for_human_review",
    "succeeded",
    "failed",
    "skipped",
    "blocked",
    "cancelled"
  ],
  "gate_decisions": [
    "continue",
    "pause",
    "retry",
    "skip",
    "block",
    "stop"
  ],
  "supported_entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "default_entry_mode": "auto_flow",
  "routing_policy": {
    "mode": "capability_conditioned_dag",
    "router": "engineering-assistant/scripts/route_skill.py",
    "signals_registry": "engineering-assistant/registry/skill-routing-signals.json",
    "execute_selected_subgraph_only": true,
    "non_selected_node_status": "skipped",
    "skip_reason_required": true,
    "parallelize_independent_ready_nodes": true,
    "completion_barrier_required": true,
    "legacy_next_nodes": "dependency_hints_only"
  },
  "start_node": "engineering-knowledge-miner",
  "terminal_nodes": [
    "skill-quality-auditor"
  ],
  "composition_policy": {
    "auto_flow": "从 start_node 开始，按 next_nodes 自动流转；每个节点先检查 preflight_input_state，非 ready 时暂停并禁止继续 formal_generation 或进入下游节点。",
    "from_node": "从用户指定 start_node 开始继续流转；必须校验该节点存在，并确认所需上游 artifacts 已提供或可从 artifact_index 获取。",
    "single_node": "只执行用户指定 target_node，不自动进入 next_nodes；输出该节点 StageRunResult 和可继续执行的后续节点建议。",
    "custom": "可按任务目标裁剪节点集合，但必须保留节点输入输出契约、失败策略、审批策略和产物路由。"
  },
  "preflight_runtime_policy": {
    "state_field": "preflight_input_state",
    "states": [
      "ready",
      "waiting_for_input",
      "waiting_for_human_review",
      "blocked"
    ],
    "formal_generation_entry_condition": "preflight_input_state == ready",
    "formal_generation_blocked_when": [
      "preflight_input_state != ready",
      "存在 blocking required_information_requests",
      "human-review HTML 已生成但补充答案未写回机读事实源"
    ],
    "waiting_for_input_allowed_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "waiting_for_input_forbidden_formal_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "block_current_node_formal_generation": true,
    "block_next_nodes": true,
    "resume_after_writeback": "StageRunRequest.context、artifact index 或 MD/JSON/YAML 已记录用户补充答案、来源和时间。"
  },
  "design_governance_policy": {
    "states": [
      "intake_collecting",
      "intake_gap_analysis",
      "waiting_for_user_input",
      "direction_confirming",
      "design_generating",
      "self_reviewing",
      "design_revising",
      "waiting_for_human_review",
      "human_review_processing",
      "design_regenerating",
      "knowledge_mining",
      "tl_rule_candidate_pending",
      "approved_or_done"
    ],
    "formal_design_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "preflight_control_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "document_lifecycle_states": [
      "not_started",
      "draft",
      "ready_for_self_review",
      "self_review_failed",
      "revised",
      "waiting_for_human_review",
      "human_review_rejected",
      "approved",
      "final",
      "superseded",
      "archived",
      "blocked",
      "waiting_for_input"
    ],
    "hard_gates": {
      "information_complete_before_formal_generation": true,
      "direction_confirmed_before_design_generation": true,
      "specialty_scope_confirmed_before_specialty_docs": true,
      "self_review_passed_before_human_review": true,
      "human_review_approved_before_final": true,
      "approved_or_final_before_code_control_surface": true
    },
    "waiting_for_input_policy": {
      "allowed_artifacts": [
        "information-inventory.json",
        "context-source-map.json",
        "missing-information-list.json",
        "required-information-request.json",
        "design-objective-plan.md",
        "scope-and-non-goals.yaml",
        "user-confirmed-facts.json",
        "design-direction-decision.md",
        "docs/human-review/<run-id>.html",
        "workflow-trace.json",
        "resume-point.json"
      ],
      "forbidden_artifacts": [
        "high-level-design.md",
        "detailed-design.md",
        "database-design.md",
        "redis-design.md",
        "mq-design.xlsx",
        "interface-contracts.yaml",
        "test-strategy.md"
      ],
      "must_not_register_formal_artifacts_as_completed": true,
      "resume_requires_writeback_to_machine_readable_source": true
    },
    "review_feedback_policy": {
      "classification_required": true,
      "classes": [
        "fact_completion",
        "direction_change",
        "document_defect",
        "standard_violation",
        "team_rule_candidate"
      ],
      "default_update_strategy": "incremental_patch_affected_artifacts",
      "full_regeneration_allowed_when": [
        "architecture_direction_changed",
        "data_model_changed",
        "interface_boundary_changed",
        "message_model_changed"
      ],
      "full_regeneration_requires": [
        "impact_analysis",
        "supersede_previous_version",
        "workflow_trace_reason"
      ]
    },
    "self_review_policy": {
      "layers": [
        "deterministic_validators",
        "reviewer_agent"
      ],
      "auto_fix_allowed_for": [
        "format_error",
        "template_gap",
        "known_fact_omission",
        "terminology_inconsistency",
        "document_routing_error",
        "confirmed_solution_clarity"
      ],
      "auto_fix_forbidden_for": [
        "business_direction_change",
        "core_interface_add_or_remove",
        "risk_strategy_change",
        "system_boundary_change",
        "human_approval_replacement"
      ],
      "unresolved_blocker_status": "blocked_or_waiting_for_human_review"
    },
    "knowledge_mining_policy": {
      "candidate_outputs": [
        "rule-candidates.json",
        "prompt-optimization-candidates.md",
        "tl-review-package.json"
      ],
      "candidate_types": [
        "team-rule-candidate",
        "document-template-candidate",
        "agent-behavior-candidate"
      ],
      "required_fields": [
        "candidate_id",
        "source_run_id",
        "original_user_change",
        "agent_original_design",
        "human_review_feedback",
        "generalized_rule",
        "scope",
        "non_scope",
        "counter_examples",
        "contains_specific_business_fact",
        "generalization_level",
        "suggested_landing_zone",
        "tl_review_status"
      ],
      "auto_apply_to_plugin": false,
      "tl_review_required": true
    }
  },
  "nodes": [
    {
      "node_id": "engineering-knowledge-miner",
      "stage": "knowledge_mining",
      "skill_id": "engineering-knowledge-miner",
      "version": "1.1.0.0",
      "mode": "standalone|workflow",
      "entry_modes": [
        "auto_flow",
        "from_node",
        "single_node"
      ],
      "depends_on": [],
      "inputs": [
        "design reports",
        "code quality reports",
        "review reports",
        "CI logs",
        "PR comments",
        "release reports",
        "incident reports"
      ],
      "outputs": [
        "engineering-lessons.md",
        "rule-candidates.yaml",
        "standard-patch-suggestions.md",
        "checklist-patch-suggestions.md",
        "skill-patch-suggestions.md",
        "regression-case-candidates.yaml",
        "knowledge-change-log.md"
      ],
      "preconditions": [
        "contract 输入可用",
        "风险策略已加载"
      ],
      "postconditions": [
        "StageRunResult 已输出",
        "产物已登记索引"
      ],
      "quality_gates": [
        "每条经验有来源证据",
        "规则默认 candidate",
        "owner 和适用范围明确",
        "反哺路径明确"
      ],
      "approval_policy": {
        "required_for": [
          "修改正式团队规范",
          "rule_candidate 标记为 approved",
          "修改高风险 skill quality gate"
        ],
        "decision": [
          "pending",
          "approved",
          "rejected"
        ]
      },
      "retry_policy": {
        "max_attempts": 1,
        "retry_on": [
          "TOOL_UNAVAILABLE",
          "UNKNOWN_ERROR"
        ]
      },
      "failure_policy": {
        "block_on": [
          "QUALITY_GATE_FAILED",
          "RISK_POLICY_VIOLATION",
          "STAGE_RESULT_CONTRACT_VIOLATION"
        ],
        "pause_on": [
          "HUMAN_APPROVAL_REQUIRED",
          "MISSING_REQUIRED_INPUT"
        ]
      },
      "next_nodes": [
        "skill-quality-auditor"
      ],
      "artifact_mapping": {
        "engineering-lessons.md": "artifacts/engineering-knowledge-miner/engineering-lessons.md",
        "rule-candidates.yaml": "artifacts/engineering-knowledge-miner/rule-candidates.yaml",
        "standard-patch-suggestions.md": "artifacts/engineering-knowledge-miner/standard-patch-suggestions.md",
        "checklist-patch-suggestions.md": "artifacts/engineering-knowledge-miner/checklist-patch-suggestions.md",
        "skill-patch-suggestions.md": "artifacts/engineering-knowledge-miner/skill-patch-suggestions.md",
        "regression-case-candidates.yaml": "artifacts/engineering-knowledge-miner/regression-case-candidates.yaml",
        "knowledge-change-log.md": "artifacts/engineering-knowledge-miner/knowledge-change-log.md"
      }
    },
    {
      "node_id": "skill-quality-auditor",
      "stage": "skill_quality",
      "skill_id": "skill-quality-auditor",
      "version": "1.1.0.0",
      "mode": "standalone|workflow",
      "entry_modes": [
        "auto_flow",
        "from_node",
        "single_node"
      ],
      "depends_on": [
        "engineering-knowledge-miner"
      ],
      "inputs": [
        "skills",
        "engineering-assistant/registry/skills.yaml",
        "skill-contract.schema.json"
      ],
      "outputs": [
        "skill-quality-report.md",
        "skill-quality-report.json",
        "skill-fix-suggestions.md",
        "skill-gate-decision.json"
      ],
      "preconditions": [
        "contract 输入可用",
        "风险策略已加载"
      ],
      "postconditions": [
        "StageRunResult 已输出",
        "产物已登记索引"
      ],
      "quality_gates": [
        "SKILL.md 存在",
        "description 清楚",
        "contract 完整",
        "schema 存在",
        "eval 覆盖",
        "workflow node 存在"
      ],
      "approval_policy": {
        "required_for": [
          "高风险 skill 入库",
          "修改高风险质量门禁",
          "skill gate 豁免"
        ],
        "decision": [
          "pending",
          "approved",
          "rejected"
        ]
      },
      "retry_policy": {
        "max_attempts": 1,
        "retry_on": [
          "TOOL_UNAVAILABLE",
          "UNKNOWN_ERROR"
        ]
      },
      "failure_policy": {
        "block_on": [
          "QUALITY_GATE_FAILED",
          "RISK_POLICY_VIOLATION",
          "STAGE_RESULT_CONTRACT_VIOLATION"
        ],
        "pause_on": [
          "HUMAN_APPROVAL_REQUIRED",
          "MISSING_REQUIRED_INPUT"
        ]
      },
      "next_nodes": [],
      "artifact_mapping": {
        "skill-quality-report.md": "artifacts/skill-quality-auditor/skill-quality-report.md",
        "skill-quality-report.json": "artifacts/skill-quality-auditor/skill-quality-report.json",
        "skill-fix-suggestions.md": "artifacts/skill-quality-auditor/skill-fix-suggestions.md",
        "skill-gate-decision.json": "artifacts/skill-quality-auditor/skill-gate-decision.json"
      }
    }
  ],
  "artifact_routing": "每个节点的输出进入 artifact-index.json，并映射到下游 StageRunRequest.artifacts",
  "human_approval_gateway": "遇到 HUMAN_APPROVAL_REQUIRED 时暂停，仅在 ApprovalRequest.decision=approved 后恢复",
  "failure_policy": "关键门禁失败则阻断，审批拒绝则停止，仅确定性工具失败可重试"
}
