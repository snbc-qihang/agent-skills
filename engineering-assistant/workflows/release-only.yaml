{
  "workflow_id": "release-only",
  "version": "1.0.1",
  "states": [
    "pending",
    "running",
    "waiting_for_input",
    "waiting_for_human_review",
    "succeeded",
    "failed",
    "skipped",
    "blocked",
    "cancelled"
  ],
  "gate_decisions": [
    "continue",
    "pause",
    "retry",
    "skip",
    "block",
    "stop"
  ],
  "supported_entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "default_entry_mode": "auto_flow",
  "start_node": "release-readiness",
  "terminal_nodes": [
    "release-retrospective"
  ],
  "composition_policy": {
    "auto_flow": "从 start_node 开始，按 next_nodes 自动流转；每个节点先执行 preflight gate，preflight_input_state != ready 时暂停，不进入 formal_generation 或 next_nodes。",
    "from_node": "从用户指定 start_node 开始继续流转；必须校验该节点存在，并确认所需上游 artifacts 已提供或可从 artifact_index 获取。",
    "single_node": "只执行用户指定 target_node，不自动进入 next_nodes；输出该节点 StageRunResult 和可继续执行的后续节点建议。",
    "custom": "可按任务目标裁剪节点集合，但必须保留节点输入输出契约、失败策略、审批策略和产物路由。"
  },
  "preflight_runtime_policy": {
    "state_field": "preflight_input_state",
    "states": [
      "ready",
      "waiting_for_input",
      "waiting_for_human_review",
      "blocked"
    ],
    "formal_generation_entry_condition": "preflight_input_state == ready",
    "pause_when": [
      "preflight_input_state != ready",
      "存在 blocking required_information_requests",
      "human-review HTML 已生成但补充答案未写回机读事实源"
    ],
    "allowed_artifacts_when_waiting_for_input": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "forbidden_formal_artifacts_when_waiting_for_input": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "block_current_node_formal_generation": true,
    "block_next_nodes": true
  },
  "design_governance_policy": {
    "states": [
      "intake_collecting",
      "intake_gap_analysis",
      "waiting_for_user_input",
      "direction_confirming",
      "design_generating",
      "self_reviewing",
      "design_revising",
      "waiting_for_human_review",
      "human_review_processing",
      "design_regenerating",
      "knowledge_mining",
      "tl_rule_candidate_pending",
      "approved_or_done"
    ],
    "formal_design_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "preflight_control_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "document_lifecycle_states": [
      "not_started",
      "draft",
      "ready_for_self_review",
      "self_review_failed",
      "revised",
      "waiting_for_human_review",
      "human_review_rejected",
      "approved",
      "final",
      "superseded",
      "archived",
      "blocked",
      "waiting_for_input"
    ],
    "hard_gates": {
      "information_complete_before_formal_generation": true,
      "direction_confirmed_before_design_generation": true,
      "specialty_scope_confirmed_before_specialty_docs": true,
      "self_review_passed_before_human_review": true,
      "human_review_approved_before_final": true,
      "approved_or_final_before_code_control_surface": true
    },
    "waiting_for_input_policy": {
      "allowed_artifacts": [
        "information-inventory.json",
        "context-source-map.json",
        "missing-information-list.json",
        "required-information-request.json",
        "design-objective-plan.md",
        "scope-and-non-goals.yaml",
        "user-confirmed-facts.json",
        "design-direction-decision.md",
        "docs/human-review/<run-id>.html",
        "workflow-trace.json",
        "resume-point.json"
      ],
      "forbidden_artifacts": [
        "high-level-design.md",
        "detailed-design.md",
        "database-design.md",
        "redis-design.md",
        "mq-design.xlsx",
        "interface-contracts.yaml",
        "test-strategy.md"
      ],
      "must_not_register_formal_artifacts_as_completed": true,
      "resume_requires_writeback_to_machine_readable_source": true
    },
    "review_feedback_policy": {
      "classification_required": true,
      "classes": [
        "fact_completion",
        "direction_change",
        "document_defect",
        "standard_violation",
        "team_rule_candidate"
      ],
      "default_update_strategy": "incremental_patch_affected_artifacts",
      "full_regeneration_allowed_when": [
        "architecture_direction_changed",
        "data_model_changed",
        "interface_boundary_changed",
        "message_model_changed"
      ],
      "full_regeneration_requires": [
        "impact_analysis",
        "supersede_previous_version",
        "workflow_trace_reason"
      ]
    },
    "self_review_policy": {
      "layers": [
        "deterministic_validators",
        "reviewer_agent"
      ],
      "auto_fix_allowed_for": [
        "format_error",
        "template_gap",
        "known_fact_omission",
        "terminology_inconsistency",
        "document_routing_error",
        "confirmed_solution_clarity"
      ],
      "auto_fix_forbidden_for": [
        "business_direction_change",
        "core_interface_add_or_remove",
        "risk_strategy_change",
        "system_boundary_change",
        "human_approval_replacement"
      ],
      "unresolved_blocker_status": "blocked_or_waiting_for_human_review"
    },
    "knowledge_mining_policy": {
      "candidate_outputs": [
        "rule-candidates.json",
        "prompt-optimization-candidates.md",
        "tl-review-package.json"
      ],
      "candidate_types": [
        "team-rule-candidate",
        "document-template-candidate",
        "agent-behavior-candidate"
      ],
      "required_fields": [
        "candidate_id",
        "source_run_id",
        "original_user_change",
        "agent_original_design",
        "human_review_feedback",
        "generalized_rule",
        "scope",
        "non_scope",
        "counter_examples",
        "contains_specific_business_fact",
        "generalization_level",
        "suggested_landing_zone",
        "tl_review_status"
      ],
      "auto_apply_to_plugin": false,
      "tl_review_required": true
    }
  },
  "lean_runtime_router_policy": {
    "artifact_persistence_policy": {
      "default_persistence_mode": "ephemeral",
      "ephemeral_root_scope": "target_project",
      "run_artifact_root": ".run-artifacts/",
      "ephemeral_root_template": ".run-artifacts/engineering-assistant/<run_id>/",
      "docs_promotion_policy": {
        "target_root": "docs/",
        "requires_explicit_user_request": true,
        "requires_delivery_material_confirmation": true
      }
    },
    "evidence_levels": [
      "inline",
      "lite",
      "standard",
      "formal"
    ],
    "persistence_modes": [
      "inline",
      "ephemeral",
      "target_repo",
      "blocked"
    ],
    "required_feedback_artifacts": [
      "assistant-run-feedback.json"
    ],
    "pollution_markers": [
      "TARGET_REPO_ARTIFACT_POLLUTION",
      "PROCESS_DOCUMENTATION_POLLUTION"
    ],
    "document_spine_policy": {
      "spine_artifact": "docs/00-index/product-planning-spine.md",
      "machine_index": "docs/00-index/document-index.json",
      "active_document_budget": 12,
      "active_context_rule": "不得因 docs 增长而全量扫读；必须通过 planning spine 和 document index 选择最小上下文。"
    },
    "agent_execution_monitor_policy": {
      "failure_markers": [
        "SUBAGENT_UNVERIFIED_SUCCESS",
        "SUBAGENT_EVIDENCE_MISSING"
      ],
      "strict_check_rule": "subagent 成功必须有 observed_evidence、independent_verification 和 orchestrator 消费记录。"
    },
    "product_plan_alignment_policy": {
      "required_before_task_close": true,
      "drift_markers": [
        "LOCAL_OPTIMUM_ONLY",
        "PRODUCT_PLAN_DRIFT"
      ]
    }
  },
  "nodes": [
    {
      "node_id": "release-readiness",
      "stage": "release_readiness",
      "skill_id": "release-readiness",
      "version": "1.0.1",
      "mode": "standalone|workflow",
      "entry_modes": [
        "auto_flow",
        "from_node",
        "single_node"
      ],
      "depends_on": [],
      "inputs": [
        "code-quality-report.json",
        "code-review-report.md",
        "release-standard.md",
        "risk_policy"
      ],
      "outputs": [
        "release-plan.md",
        "release-checklist.md",
        "rollback-plan.md",
        "release-risk-report.json",
        "release-gate-decision.json"
      ],
      "preconditions": [
        "contract 输入可用",
        "风险策略已加载",
        "preflight gate 已执行"
      ],
      "preflight_gate": {
        "state_field": "preflight_input_state",
        "states": [
          "ready",
          "waiting_for_input",
          "waiting_for_human_review",
          "blocked"
        ],
        "formal_generation_entry_condition": "preflight_input_state == ready",
        "block_formal_generation_when_not_ready": true,
        "block_next_nodes_when_not_ready": true
      },
      "postconditions": [
        "StageRunResult 已输出",
        "产物已登记索引"
      ],
      "quality_gates": [
        "发布窗口明确",
        "回滚方案存在",
        "监控告警存在",
        "审批状态有效"
      ],
      "approval_policy": {
        "required_for": [
          "生产发布",
          "生产配置变更",
          "高风险发布",
          "回滚操作"
        ],
        "decision": [
          "pending",
          "approved",
          "rejected"
        ]
      },
      "retry_policy": {
        "max_attempts": 1,
        "retry_on": [
          "TOOL_UNAVAILABLE",
          "UNKNOWN_ERROR"
        ]
      },
      "failure_policy": {
        "block_on": [
          "QUALITY_GATE_FAILED",
          "RISK_POLICY_VIOLATION",
          "STAGE_RESULT_CONTRACT_VIOLATION"
        ],
        "pause_on": [
          "HUMAN_APPROVAL_REQUIRED",
          "MISSING_REQUIRED_INPUT"
        ]
      },
      "next_nodes": [
        "release-verification"
      ],
      "artifact_mapping": {
        "release-plan.md": "artifacts/release-readiness/release-plan.md",
        "release-checklist.md": "artifacts/release-readiness/release-checklist.md",
        "rollback-plan.md": "artifacts/release-readiness/rollback-plan.md",
        "release-risk-report.json": "artifacts/release-readiness/release-risk-report.json",
        "release-gate-decision.json": "artifacts/release-readiness/release-gate-decision.json"
      }
    },
    {
      "node_id": "release-verification",
      "stage": "release_verification",
      "skill_id": "release-verification",
      "version": "1.0.1",
      "mode": "standalone|workflow",
      "entry_modes": [
        "auto_flow",
        "from_node",
        "single_node"
      ],
      "depends_on": [
        "release-readiness"
      ],
      "inputs": [
        "release-plan.md",
        "release-checklist.md",
        "observability data",
        "risk_policy"
      ],
      "outputs": [
        "release-verification-report.md",
        "production-checks.json",
        "anomaly-list.md"
      ],
      "preconditions": [
        "contract 输入可用",
        "风险策略已加载",
        "preflight gate 已执行"
      ],
      "preflight_gate": {
        "state_field": "preflight_input_state",
        "states": [
          "ready",
          "waiting_for_input",
          "waiting_for_human_review",
          "blocked"
        ],
        "formal_generation_entry_condition": "preflight_input_state == ready",
        "block_formal_generation_when_not_ready": true,
        "block_next_nodes_when_not_ready": true
      },
      "postconditions": [
        "StageRunResult 已输出",
        "产物已登记索引"
      ],
      "quality_gates": [
        "核心功能验证通过",
        "错误率/延迟未触发阈值",
        "业务指标正常",
        "回滚条件未触发"
      ],
      "approval_policy": {
        "required_for": [
          "回滚操作",
          "生产验证豁免",
          "延长观察窗口"
        ],
        "decision": [
          "pending",
          "approved",
          "rejected"
        ]
      },
      "retry_policy": {
        "max_attempts": 1,
        "retry_on": [
          "TOOL_UNAVAILABLE",
          "UNKNOWN_ERROR"
        ]
      },
      "failure_policy": {
        "block_on": [
          "QUALITY_GATE_FAILED",
          "RISK_POLICY_VIOLATION",
          "STAGE_RESULT_CONTRACT_VIOLATION"
        ],
        "pause_on": [
          "HUMAN_APPROVAL_REQUIRED",
          "MISSING_REQUIRED_INPUT"
        ]
      },
      "next_nodes": [
        "release-retrospective"
      ],
      "artifact_mapping": {
        "release-verification-report.md": "artifacts/release-verification/release-verification-report.md",
        "production-checks.json": "artifacts/release-verification/production-checks.json",
        "anomaly-list.md": "artifacts/release-verification/anomaly-list.md"
      }
    },
    {
      "node_id": "release-retrospective",
      "stage": "release_retrospective",
      "skill_id": "release-retrospective",
      "version": "1.0.1",
      "mode": "standalone|workflow",
      "entry_modes": [
        "auto_flow",
        "from_node",
        "single_node"
      ],
      "depends_on": [
        "release-verification"
      ],
      "inputs": [
        "release-verification-report.md",
        "code-quality-report.json",
        "incident reports",
        "release logs"
      ],
      "outputs": [
        "release-retrospective.md",
        "release-lessons.yaml",
        "follow-up-actions.md"
      ],
      "preconditions": [
        "contract 输入可用",
        "风险策略已加载",
        "preflight gate 已执行"
      ],
      "preflight_gate": {
        "state_field": "preflight_input_state",
        "states": [
          "ready",
          "waiting_for_input",
          "waiting_for_human_review",
          "blocked"
        ],
        "formal_generation_entry_condition": "preflight_input_state == ready",
        "block_formal_generation_when_not_ready": true,
        "block_next_nodes_when_not_ready": true
      },
      "postconditions": [
        "StageRunResult 已输出",
        "产物已登记索引"
      ],
      "quality_gates": [
        "问题有证据",
        "行动项有 owner",
        "规范候选状态为 candidate",
        "skill 改进候选明确"
      ],
      "approval_policy": {
        "required_for": [
          "行动项关闭",
          "规范候选批准",
          "高风险复盘结论发布"
        ],
        "decision": [
          "pending",
          "approved",
          "rejected"
        ]
      },
      "retry_policy": {
        "max_attempts": 1,
        "retry_on": [
          "TOOL_UNAVAILABLE",
          "UNKNOWN_ERROR"
        ]
      },
      "failure_policy": {
        "block_on": [
          "QUALITY_GATE_FAILED",
          "RISK_POLICY_VIOLATION",
          "STAGE_RESULT_CONTRACT_VIOLATION"
        ],
        "pause_on": [
          "HUMAN_APPROVAL_REQUIRED",
          "MISSING_REQUIRED_INPUT"
        ]
      },
      "next_nodes": [],
      "artifact_mapping": {
        "release-retrospective.md": "artifacts/release-retrospective/release-retrospective.md",
        "release-lessons.yaml": "artifacts/release-retrospective/release-lessons.yaml",
        "follow-up-actions.md": "artifacts/release-retrospective/follow-up-actions.md"
      }
    }
  ],
  "artifact_routing": "每个节点的输出进入 artifact-index.json，并映射到下游 StageRunRequest.artifacts",
  "human_approval_gateway": "遇到 HUMAN_APPROVAL_REQUIRED 时暂停，仅在 ApprovalRequest.decision=approved 后恢复",
  "failure_policy": "关键门禁失败则阻断，审批拒绝则停止，仅确定性工具失败可重试"
}
