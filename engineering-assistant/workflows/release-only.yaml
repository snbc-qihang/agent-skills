{
  "workflow_id": "release-only",
  "version": "1.0.0.3",
  "states": [
    "pending",
    "running",
    "waiting_for_input",
    "waiting_for_human_review",
    "succeeded",
    "failed",
    "skipped",
    "blocked",
    "cancelled"
  ],
  "gate_decisions": [
    "continue",
    "pause",
    "retry",
    "skip",
    "block",
    "stop"
  ],
  "supported_entry_modes": [
    "auto_flow",
    "from_node",
    "single_node"
  ],
  "default_entry_mode": "auto_flow",
  "start_node": "release-readiness",
  "terminal_nodes": [
    "release-retrospective"
  ],
  "composition_policy": {
    "auto_flow": "从 start_node 开始，按 next_nodes 自动流转；每个节点先检查 preflight_input_state，非 ready 时暂停并禁止继续 formal_generation 或进入下游节点。",
    "from_node": "从用户指定 start_node 开始继续流转；必须校验该节点存在，并确认所需上游 artifacts 已提供或可从 artifact_index 获取。",
    "single_node": "只执行用户指定 target_node，不自动进入 next_nodes；输出该节点 StageRunResult 和可继续执行的后续节点建议。",
    "custom": "可按任务目标裁剪节点集合，但必须保留节点输入输出契约、失败策略、审批策略和产物路由。"
  },
  "preflight_runtime_policy": {
    "state_field": "preflight_input_state",
    "states": [
      "ready",
      "waiting_for_input",
      "waiting_for_human_review",
      "blocked"
    ],
    "formal_generation_entry_condition": "preflight_input_state == ready",
    "formal_generation_blocked_when": [
      "preflight_input_state != ready",
      "存在 blocking required_information_requests",
      "human-review HTML 已生成但补充答案未写回机读事实源"
    ],
    "waiting_for_input_allowed_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "waiting_for_input_forbidden_formal_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "block_current_node_formal_generation": true,
    "block_next_nodes": true,
    "resume_after_writeback": "StageRunRequest.context、artifact index 或 MD/JSON/YAML 已记录用户补充答案、来源和时间。"
  },
  "lean_runtime_router_policy": {
    "task_kinds": [
      "context",
      "audit",
      "change",
      "release",
      "self_healing"
    ],
    "evidence_levels": [
      "inline",
      "lite",
      "standard",
      "formal"
    ],
    "persistence_modes": [
      "inline",
      "ephemeral",
      "target_repo",
      "blocked"
    ],
    "default_task_kind": "context",
    "default_evidence_level": "lite",
    "default_persistence_mode": "ephemeral",
    "routing_rule": "先判断任务类型、证据等级和持久化模式，再决定是否进入轻量上下文、标准开发、正式审计或发布链路；进入研发助手不等于进入固定重流程。",
    "artifact_persistence_policy": {
      "default_persistence_mode": "ephemeral",
      "ephemeral_root_scope": "target_project",
      "run_artifact_root": ".run-artifacts/",
      "ephemeral_root_template": ".run-artifacts/engineering-assistant/<run_id>/",
      "target_repo_allowed_when": [
        "用户明确要求正式留档、交接或 CI 证据，且目标路径位于 docs/ 正式文档目录",
        "evidence_level=formal 且产物属于正式设计、决策、发布或项目规范，并带有 docs_promotion_target",
        "过程资料已被确认应作为交付资料，自动从 .run-artifacts 提升到 docs/，并记录 source_run_artifact",
        "目标项目已有约定要求该证据进入仓库且不违反 document_retention_policy"
      ],
      "docs_promotion_policy": {
        "source_root": ".run-artifacts/",
        "target_root": "docs/",
        "auto_promote_when": [
          "delivery_material_confirmed",
          "formal_evidence_approved",
          "handoff_or_ci_record_required"
        ],
        "requires": [
          "source_run_artifact",
          "docs_promotion_target",
          "document_metadata",
          "version_bump_reason"
        ],
        "forbidden_targets": [
          "docs/human-review/",
          "docs/human-readable/"
        ]
      },
      "target_repo_forbidden_for": [
        "runtime-route-decision.json",
        "artifact-persistence-policy.json",
        "capability-invocation-ledger.json",
        "capability-health.json",
        "capability-output-consumption.json",
        "assistant-run-feedback.json",
        "未确认交付属性的临时规划文档",
        "未确认交付属性的开发过程文档",
        "阶段总结",
        "临时审计报告",
        "workflow summary",
        "post run review"
      ],
      "pollution_markers": [
        "TARGET_REPO_ARTIFACT_POLLUTION",
        "PROCESS_DOCUMENTATION_POLLUTION"
      ]
    },
    "capability_families": {
      "code_context": {
        "candidates": [
          "CodeGraph",
          "Understand-Anything"
        ],
        "call_when": [
          "复杂仓库",
          "调用链或影响范围不清",
          "需要识别已有能力"
        ]
      },
      "parallelization": {
        "candidates": [
          "ATeam"
        ],
        "call_when": [
          "多仓",
          "多端",
          "跨两个以上独立技术面",
          "可并行分析且风险高"
        ]
      },
      "simplification": {
        "candidates": [
          "ponytail"
        ],
        "call_when": [
          "过度设计风险",
          "业务堆代码风险",
          "实现方案复杂度失控"
        ]
      },
      "security": {
        "candidates": [
          "codex-security"
        ],
        "call_when": [
          "鉴权",
          "权限",
          "支付",
          "敏感数据",
          "注入",
          "越权"
        ]
      },
      "frontend_runtime": {
        "candidates": [
          "build-web-apps",
          "ui-frontend-craft",
          "browser/chrome"
        ],
        "call_when": [
          "页面",
          "交互",
          "组件",
          "浏览器运行态验证"
        ]
      },
      "vcs_ci_prod": {
        "candidates": [
          "github",
          "circleci",
          "sentry",
          "coderabbit"
        ],
        "call_when": [
          "Git",
          "PR",
          "CI",
          "发布",
          "生产问题"
        ]
      },
      "self_healing": {
        "candidates": [
          "darwin-skill",
          "skill-quality-auditor"
        ],
        "call_when": [
          "用户纠偏",
          "重复问题",
          "规则失效",
          "插件自愈"
        ]
      }
    },
    "capability_decisions": [
      "call",
      "skip",
      "unavailable",
      "blocked"
    ],
    "capability_health_required_for": [
      "code_context",
      "parallelization",
      "frontend_runtime",
      "vcs_ci_prod",
      "security"
    ],
    "existing_capability_first": [
      "existing_pages",
      "api_wrappers",
      "controllers",
      "services",
      "mappers_or_repositories",
      "database_tables",
      "tests",
      "docs_and_memory"
    ],
    "required_feedback_artifacts": [
      "assistant-run-feedback.json"
    ],
    "assistant_feedback_policy": {
      "required_before_final_response": true,
      "default_persistence_mode": "ephemeral",
      "feedback_artifacts": [
        "assistant-run-feedback.json"
      ],
      "summary_artifact_allowed_when": [
        "evidence_level=formal",
        "用户明确要求交接或审计留档"
      ],
      "must_be_consumed_by_agent": true,
      "darwin_trigger_markers": [
        "DUPLICATE_CAPABILITY_RISK",
        "IMPLEMENTATION_STRATEGY_NOT_EVALUATED",
        "ATEAM_GATE_NOT_EVALUATED",
        "CAPABILITY_HEALTH_NOT_CHECKED",
        "ASSISTANT_FEEDBACK_NOT_GENERATED",
        "ASSISTANT_FEEDBACK_NOT_CONSUMED_BY_AGENT",
        "TARGET_REPO_ARTIFACT_POLLUTION",
        "PROCESS_DOCUMENTATION_POLLUTION"
      ]
    },
    "pollution_markers": [
      "TARGET_REPO_ARTIFACT_POLLUTION",
      "PROCESS_DOCUMENTATION_POLLUTION"
    ]
  },
  "design_governance_policy": {
    "states": [
      "intake_collecting",
      "intake_gap_analysis",
      "waiting_for_user_input",
      "direction_confirming",
      "design_generating",
      "self_reviewing",
      "design_revising",
      "waiting_for_human_review",
      "human_review_processing",
      "design_regenerating",
      "knowledge_mining",
      "tl_rule_candidate_pending",
      "approved_or_done"
    ],
    "formal_design_artifacts": [
      "high-level-design.md",
      "detailed-design.md",
      "database-design.md",
      "redis-design.md",
      "mq-design.xlsx",
      "interface-contracts.yaml",
      "test-strategy.md"
    ],
    "preflight_control_artifacts": [
      "information-inventory.json",
      "context-source-map.json",
      "missing-information-list.json",
      "required-information-request.json",
      "design-objective-plan.md",
      "scope-and-non-goals.yaml",
      "user-confirmed-facts.json",
      "design-direction-decision.md",
      "docs/human-review/<run-id>.html",
      "workflow-trace.json",
      "resume-point.json"
    ],
    "document_retention_policy": {
      "persist_allowed_document_classes": [
        "formal_design",
        "formal_decision",
        "formal_index"
      ],
      "transient_only_document_classes": [
        "run_evidence",
        "agent_workspace",
        "process_trace",
        "human_review_packet",
        "human_readable_render",
        "rule_governance"
      ],
      "final_project_document_roots": [
        "docs/00-index/",
        "docs/architecture/",
        "docs/design/",
        "docs/decisions/",
        "docs/release/"
      ],
      "agent_workspace_roots": [
        ".run-artifacts/",
        "artifacts/",
        "artifacts/_control/"
      ],
      "human_review_roots": [
        "docs/human-review/"
      ],
      "human_readable_render_roots": [
        "docs/human-readable/"
      ],
      "completion_rule": "研发完成后只保留 approved/final + persist + formal_* 的确定性设计/决策/索引文档；run evidence、agent workspace、trace、缺失信息、临时评审和 HTML 审阅包不得进入正式留存集合。"
    },
    "document_lifecycle_states": [
      "not_started",
      "draft",
      "ready_for_self_review",
      "self_review_failed",
      "revised",
      "waiting_for_human_review",
      "human_review_rejected",
      "approved",
      "final",
      "superseded",
      "archived",
      "blocked",
      "waiting_for_input"
    ],
    "hard_gates": {
      "information_complete_before_formal_generation": true,
      "direction_confirmed_before_design_generation": true,
      "specialty_scope_confirmed_before_specialty_docs": true,
      "self_review_passed_before_human_review": true,
      "human_review_approved_before_final": true,
      "approved_or_final_before_code_control_surface": true
    },
    "waiting_for_input_policy": {
      "allowed_artifacts": [
        "information-inventory.json",
        "context-source-map.json",
        "missing-information-list.json",
        "required-information-request.json",
        "design-objective-plan.md",
        "scope-and-non-goals.yaml",
        "user-confirmed-facts.json",
        "design-direction-decision.md",
        "docs/human-review/<run-id>.html",
        "workflow-trace.json",
        "resume-point.json"
      ],
      "forbidden_artifacts": [
        "high-level-design.md",
        "detailed-design.md",
        "database-design.md",
        "redis-design.md",
        "mq-design.xlsx",
        "interface-contracts.yaml",
        "test-strategy.md"
      ],
      "must_not_register_formal_artifacts_as_completed": true,
      "resume_requires_writeback_to_machine_readable_source": true
    },
    "review_feedback_policy": {
      "classification_required": true,
      "classes": [
        "fact_completion",
        "direction_change",
        "document_defect",
        "standard_violation",
        "team_rule_candidate"
      ],
      "default_update_strategy": "incremental_patch_affected_artifacts",
      "full_regeneration_allowed_when": [
        "architecture_direction_changed",
        "data_model_changed",
        "interface_boundary_changed",
        "message_model_changed"
      ],
      "full_regeneration_requires": [
        "impact_analysis",
        "supersede_previous_version",
        "workflow_trace_reason"
      ]
    },
    "self_review_policy": {
      "layers": [
        "deterministic_validators",
        "reviewer_agent"
      ],
      "auto_fix_allowed_for": [
        "format_error",
        "template_gap",
        "known_fact_omission",
        "terminology_inconsistency",
        "document_routing_error",
        "confirmed_solution_clarity"
      ],
      "auto_fix_forbidden_for": [
        "business_direction_change",
        "core_interface_add_or_remove",
        "risk_strategy_change",
        "system_boundary_change",
        "human_approval_replacement"
      ],
      "unresolved_blocker_status": "blocked_or_waiting_for_human_review"
    },
    "knowledge_mining_policy": {
      "candidate_outputs": [
        "rule-candidates.json",
        "prompt-optimization-candidates.md",
        "tl-review-package.json"
      ],
      "candidate_types": [
        "team-rule-candidate",
        "document-template-candidate",
        "agent-behavior-candidate"
      ],
      "required_fields": [
        "candidate_id",
        "source_run_id",
        "original_user_change",
        "agent_original_design",
        "human_review_feedback",
        "generalized_rule",
        "scope",
        "non_scope",
        "counter_examples",
        "contains_specific_business_fact",
        "generalization_level",
        "suggested_landing_zone",
        "tl_review_status"
      ],
      "auto_apply_to_plugin": false,
      "tl_review_required": true
    }
  },
